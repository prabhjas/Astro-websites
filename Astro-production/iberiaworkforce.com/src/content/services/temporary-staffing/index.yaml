# The Figma accordion is drawn closed, so it specifies the questions but no
# answers. Copy supplied by the client alongside the design.
faq:
  eyebrow: TEMPORARY STAFFING EUROPE
  heading: Frequently asked questions
  items:
    - question: Is temporary staffing legal in the countries you operate in?
      answer: >-
        Yes. Temporary staffing is a recognized and legally established
        employment model across Europe. Providers must hold the relevant
        licensing or credentials for each country - which we do. Operating
        without proper licensing is illegal and exposes clients to fines and
        liability.
    - question: What's the difference between temporary staffing and temp-to-hire?
      answer: >-
        Temporary staffing is fixed-term or project-based, the worker's role
        ends on a specific date. Temp-to-hire converts a temporary assignment
        into a permanent role after a trial period. The legal requirements
        differ: temporary staffing has a defined end date in the contract;
        temp-to-hire includes a pathway to conversion. We handle both.
    - question: How quickly can we get a temporary worker on-site?
      answer: >-
        For standard roles, typically 1–2 weeks from request to start, depending
        on how detailed your job specifications are. Specialized or high-skill
        roles may take longer if candidate sourcing is more competitive. We give
        you a realistic timeline upfront based on the role's complexity and
        current candidate availability.
    - question: What if we need to end the assignment early?
      answer: >-
        Temporary assignments end on the contracted end date. If you need to
        terminate early, local law requires documented grounds, same as
        permanent employment. We manage the exit correctly so there's no
        liability overhang. Early termination is possible but follows legal
        procedure.
    - question: Can we use temporary staffing for visa-sponsored workers?
      answer: >-
        Yes. Non-EU workers on work permits or visas can be placed in temporary
        assignments. The visa category and work permit terms determine what
        roles are legally allowed. We verify this upfront and ensure the
        assignment matches the worker's visa classification so there's no
        compliance violation.
    - question: How is temporary staffing different from using contractors?
      answer: >-
        Temporary staffing means the worker is employed by us, not
        self-employed. That matters legally: employment law protections apply,
        social security contributions are paid by the employer, and the legal
        exposure sits with the provider. With contractors, the worker is
        self-employed, which changes the compliance requirements entirely.
    - question: What happens if an incident or injury occurs during the assignment?
      answer: >-
        Workplace injuries, incidents, or disputes during a temporary assignment
        follow the same employment law as permanent roles. We carry the legal
        liability and manage the investigation, incident reporting, and any
        claims that arise. Your company is protected from direct employment
        exposure.
    - question: Who is Iberia Workforce, and how do you operate?
      answer: >-
        Iberia Workforce is part of Connect Group. We operate temporary staffing
        services through our own licensed structures in each country - no local
        partner intermediaries. Our in-house legal and HR teams handle
        recruitment, screening, contract drafting, payroll, and compliance
        directly. We carry the legal and compliance risk; you manage the
        day-to-day work.
    - question: Can we use temporary staffing for recurring seasonal needs?
      answer: >-
        Yes. Many of our clients use recurring temporary staffing for seasonal
        peaks. We can structure rolling temporary contracts that restart each
        season, fully compliant and with minimal administrative overhead on your
        end.

closing:
  heading: Temporary staffing isn't a shortcut to bypass employment law.
  body: >-
    It's a compliant, legal way to build flexibility into your workforce. But
    only if the provider carries the legal risk and understands the compliance
    layer.
  footnote: >-
    Describe your staffing need - what's the role, duration, start date,
    headcount - and we'll tell you exactly how much it costs, how quickly we can
    fill it, and what compliance you're getting.
