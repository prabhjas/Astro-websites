intro:
  heading: What is Temporary Staffing?
  # The 768 frame (495:6579) keeps the claim, the prose and the button in one
  # column, so the two columns wait for desktop.
  splitAt: lg
  paragraphs:
    - >-
      Temporary staffing is the provision of workers for fixed-term or
      project-based roles. The staffing provider employs the worker, manages
      payroll and compliance, and deploys them to your company for a defined
      period. You direct the day-to-day work and set performance standards. The
      provider carries the legal exposure - employment contracts, social
      security, tax filings, and compliance risk if something goes wrong.
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

whyItMatters:
  heading: Why Temporary Staffing matters?
  subheading: Temporary staffing solves three business problems at once
  body: >-
    Most staffing agencies treat temporary work as a revenue play, not a
    problem-solving play. You lose because their incentives don't align with
    yours. We're built differently. Legal compliance is how we operate, not a
    side service.
  items:
    - title: You avoid permanent headcount risk.
      description: >-
        Economic uncertainty, project end dates, seasonal swings, you need
        capacity without betting your budget on permanent salaries, benefits,
        severance obligations, and long-term employment commitments. Temporary
        staffing lets you scale up and down without the overhead.
    - title: You move faster than permanent hiring.
      description: >-
        Good candidates are off the market within 10 days. Your internal hiring
        process takes weeks. A licensed staffing provider has pre-screened
        talent ready to start within days, not months. That gap is your
        competitive advantage or your missed opportunity.
    - title: Legal compliance stops being your problem.
      description: >-
        Employment contracts, payroll, taxes, social security, workplace
        injuries, disputes - these sit with the provider, not with you. You get
        capacity without the compliance liability.
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

