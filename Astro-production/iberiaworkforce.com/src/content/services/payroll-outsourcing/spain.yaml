# The light split: claim and CTA in the left column, the prose bottom-aligned in
# the right. On white rather than cream, because the band below it is cream.
differentiator:
  tone: light
  surface: surface
  ctaPlacement: claim
  heading: Why Payroll Outsourcing matters in Spain?
  subheading: The CBA misclassification problem
  paragraphs:
    - >-
      Most companies self-classify their CBA. A tech startup thinks they're
      under "Offices and Booths" (Oficinas y Despachos). They're not. They
      should be under the Engineering/IT framework — higher minimum salaries.
      Six months in, an audit catches it. Now you owe retrospective salary
      adjustments across your entire tech team, plus fines.
    - >-
      Your payroll software doesn't know which Convenio you're actually under.
      It just processes whatever you tell it. If you tell it wrong, it runs
      wrong for months. That's why you need payroll specialists who actually
      know Spanish law — not software templates.
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

