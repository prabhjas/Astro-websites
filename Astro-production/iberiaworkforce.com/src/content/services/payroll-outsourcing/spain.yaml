# The design draws the accordion closed and specifies only the questions; the
# answers below are the client's copy, supplied separately.
faq:
  eyebrow: PAYROLL OUTSOURCING SPAIN
  heading: Frequently asked questions
  items:
    - question: How do you know which Convenio Colectivo applies to our company?
      answer: >-
        We review your company type, industry classification, and actual role
        breakdown. Then we confirm the applicable CBA(s) upfront. For example:
        tech company, 25 people, Barcelona-based, primarily engineers and
        product roles → Engineering/IT framework (not Offices and Booths). We
        make that call before payroll starts, not after an audit questions it.
    - question: What happens if we're currently using the wrong Convenio?
      answer: >-
        We catch it at transition. If you've been paying under the wrong
        Convenio, we flag the exposure, calculate what you owe in retrospective
        adjustments, and either adjust going forward or recommend a corrective
        filing with authorities. We don't hide it.
    - question: Why is CBA classification such a big deal?
      answer: >-
        Because the wrong Convenio means the wrong salary minimums, the wrong
        overtime rates, the wrong mandatory bonuses. Auditors flag it. You owe
        back pay plus fines. It's not a compliance box to check — it's the
        difference between payroll that holds up and payroll that becomes a
        liability.
    - question: Can payroll outsourcing software just handle this automatically?
      answer: >-
        No. Software processes whatever you tell it. It doesn't know your
        company's actual industry classification or which Convenio you should be
        under. That's a legal question, not a processing question. That's why you
        need lawyers reviewing the structure, not just accountants running the
        numbers.
    - question: What exactly does TGSS cover, and why does it cost so much?
      answer: >-
        TGSS is employer social security — pension contributions, healthcare,
        disability, workplace accident insurance. Employer cost runs roughly 30%
        on top of gross salary. It's mandatory and non-negotiable. We calculate
        it correctly, file it by the deadline, and track it per employee and per
        month. If your current payroll person is guessing at the rate, that's
        where problems start.
    - question: How does IRPF withholding work, and does location matter?
      answer: >-
        IRPF is personal income tax withholding. The rate depends on employee
        gross salary and regional deduction variances. An employee in Barcelona
        might have a slightly different withholding than one in Madrid for the
        same salary. We track location-specific rates and withhold correctly.
        It's filed monthly and reconciled annually.
    - question: >-
        What's the difference between nómina processing and payroll outsourcing?
      answer: >-
        Nómina is the monthly payslip and calculation. Payroll outsourcing is the
        full service: CBA classification, nómina generation, TGSS filings, IRPF
        handling, bonus management, leave tracking, severance planning. Nómina is
        one piece. Payroll outsourcing is the entire responsibility.
    - question: If we're audited, who handles it?
      answer: >-
        We do. If the audit flags a misclassification or filing error on our
        watch, we defend the position, file corrections if needed, and cover the
        cost of remediation. That's what carrying compliance risk means.
    - question: Can we transition mid-year, or do we have to wait until January?
      answer: >-
        You can transition any month. We handle the data migration, confirm CBA
        classification for your existing team, and calculate any pro-rata
        adjustments for the transition month. Most clients transition within 2–3
        weeks of signing.
    - question: What if we're a foreign company hiring in Spain for the first time?
      answer: >-
        Tell us the role, location, and whether the hire is EU or non-EU. We
        confirm the applicable Convenio, run payroll correctly from day one, and
        handle TGSS/IRPF as if you'd been operating in Spain for years.
    - question: Who is Iberia Workforce, and how do you operate in Spain?
      answer: >-
        Iberia Workforce operates as a payroll outsourcing provider in Spain from
        our Barcelona office. We're part of Connect Group. Our in-house legal
        team and payroll specialists handle CBA classification, nómina
        processing, and TGSS/IRPF filings directly — no outsourced local
        partners. The team structuring your payroll is the same team that ensures
        it's legally sound.

