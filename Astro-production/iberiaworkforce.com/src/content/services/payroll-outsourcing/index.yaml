# The design draws the accordion closed, so it specifies the questions only.
# Answers supplied separately by the client, as on the EOR hub. Two questions
# are worded more fully here than in Figma ("Is it cheaper than hiring in-house?"
# against "…than hiring a payroll accountant in-house?", and the payroll-person
# one) — the client's wording is the one that ships.
faq:
  eyebrow: PAYROLL OUTSOURCING EUROPE
  heading: Frequently asked questions
  items:
    - question: How much does payroll outsourcing cost?
      answer: >-
        Pricing depends on headcount and the countries you’re operating in. For
        companies under 50 employees, we quote per-employee monthly rates. For
        enterprises with 50+ employees across multiple countries, we offer a
        monthly retainer. Tell us your scenario and we’ll give you an exact
        breakdown — no obligation.
    - question: Is it cheaper than hiring a payroll accountant in-house?
      answer: >-
        Yes. An in-house payroll specialist or accountant costs
        €1,500–€2,500/month in salary alone, plus recruiting, training,
        benefits, and turnover risk. Payroll outsourcing services start lower
        and scale with your headcount.
    - question: What if I already have a payroll person? Can you work alongside them?
      answer: >-
        Yes. Some companies keep payroll in-house but need multi-country
        support. Others are outsourcing for the first time. We work with
        whatever structure makes sense for your business.
    - question: How quickly can we switch to your payroll outsourcing services?
      answer: >-
        For companies currently processing payroll internally, typically 2–3
        weeks to transition if documentation is ready. If you’re switching from
        another provider, the timeline depends on data migration complexity.
        We’ll give you a realistic estimate upfront.
    - question: What if my company operates in multiple countries?
      answer: >-
        We manage payroll in Spain, Germany, Portugal, Poland, and Italy. Each
        location’s payroll runs under its own country’s labor law — no
        approximation. If you have employees in countries we don’t yet operate
        in, we can coordinate with local partners for those geographies.
    - question: >-
        Can you handle visa and work permit documentation as part of payroll
        outsourcing?
      answer: >-
        Yes. Non-EU hires, visa sponsorship, work permit processing — if it
        affects payroll (tax residency, salary categorization, benefit
        eligibility), we handle it as part of the service. This is built into
        our legal team’s work, not outsourced to a third party.
    - question: What happens if we need to change an employee’s salary or contract terms?
      answer: >-
        You tell us the change. We review it for labor law compliance — minimum
        wage floors, visa category impacts, tax implications — and either
        approve it or suggest a compliant alternative that achieves the same
        business goal.
    - question: Who is Iberia Workforce, and how do you operate?
      answer: >-
        Iberia Workforce is part of Connect Group. We operate payroll
        outsourcing through an in-house team of employment lawyers and payroll
        specialists across Europe. No offshore processing. No third-party local
        partners. The team that structures your payroll is the same team that
        ensures it’s legally sound.

closing:
  heading: >-
    You hire people to do their jobs. You shouldn’t have to become a payroll
    expert just to avoid a fine.
  highlight: payroll expert
  body: >-
    Describe your team — size, locations, any work permit complexity — and
    we’ll tell you exactly how much payroll outsourcing costs and what it
    includes.
