type: hub
label: Recruitment

seo:
  title: Recruitment & Executive Search | Iberia Workforce
  description: >-
    Recruitment with legal checks built in. We find talent, validate visas
    and non-competes, then you decide. Pay after they start.
  schema:
    serviceName: Recruitment Services
    serviceType: Recruitment & Talent Acquisition
    areaServed: Europe
    address:
      locality: Barcelona
      country: Spain

hero:
  heading: Recruitment services built on legal certainty, not just speed
  badges:
    - icon: law
      label: Law Firm Backed
    - icon: employee
      label: Visa & Agreement Experts
    - icon: search
      label: Executive Search
    - icon: global
      label: 5 European Countries
  body: >-
    We find the right candidate for your role. Our lawyers validate they can
    actually join (visa, non-compete, existing agreements). You do not pay until
    they start. If it does not work in 60 days, we find you a replacement free.
    That is recruitment with skin in the game.
  image: ../../../assets/images/recruitment-hub-hero-background-desktop.webp
  imageTablet: ../../../assets/images/recruitment-hub-hero-background-tablet.webp
  imageMobile: ../../../assets/images/recruitment-hub-hero-background-mobile.webp
  imageAlt: ""
  primaryCta:
    label: Talk to a Specialist
    href: "#contact-form"
  secondaryCta:
    label: How It Works?
    href: "#how-it-works"

definition:
  heading: What is Recruitment?
  body: >-
    Recruitment is sourcing, screening, and placing candidates into roles. Most
    recruiters stop there. We do not. Recruitment done right means finding
    someone qualified and validating they can actually take the job - which
    means checking visa categories, reviewing non-compete clauses, verifying
    existing employment agreements will not block the hire. You choose the
    candidate. Our lawyers ensure they can onboard without legal friction.
  image: ../../../assets/images/recruitment-hub-definition.webp
  imageAlt: A recruiter interviewing a candidate across a table in a bright office

# The "SignatureSection" band (502:5442 / 502:5456 / 502:5470) — the same
# stacked arrangement the EOR Spain page draws, with the Iberian contour map
# bleeding in from the right behind a navy wash.
differentiator:
  layout: stacked
  heading: Why Recruitment matters?
  subheading: The hidden costs of wrong hires
  paragraphs:
    - >-
      Most recruitment stops at placement. You get a CV, you hire someone, then
      the friction surfaces: visa category does not allow the role. Non-compete
      from their previous employer blocks them. Existing employment agreement
      requires 90 days notice and restricts where they can work next.
    - >-
      You have already made an offer. Now you are renegotiating or the hire
      falls apart. The right recruitment means finding the person and validating
      upfront that they can actually start. No surprises after.
  background: ../../../assets/images/recruitment-hub-matters.webp
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

whyChoose:
  # The claim travels with the reasons, as the homepage does it.
  sticky: true
  heading: Why choose Iberia Workforce for Recruitment services?
  highlight: Recruitment
  items:
    - title: We validate every hire before you commit.
      description: >-
        Most recruiters send you a CV and move on. We find the candidate, then
        our legal team checks: visa category for international hires,
        non-compete clauses, existing employment agreements that might block the
        hire. You get a yes-or-no answer on feasibility before you make an
        offer.
    - title: We specialize in the roles nobody else can find.
      description: >-
        Standard mid-level roles in fintech or IT: 1–2 weeks. Niche specialists
        like - AI researchers, specialized logistics experts, domain experts in
        emerging fields - take longer because they actually exist in smaller
        pools. We have the headhunting depth and network to find talent other
        recruiters say "does not exist."
    - title: We hunt C-level and executive talent like it is our specialty.
      description: >-
        Director-level, C-suite, board positions - these require a different
        approach than posting a job. We headhunt. We know who is good, who is
        available, and who might be open to a conversation.
    - title: >-
        You do not pay until they start. If it does not work in 60 days, we find
        you someone else free.
      description: >-
        Most recruiters take a fee upfront and disappear. We take 10% of annual
        salary, but only after the candidate has been working 15 days and you
        have decided they are the right fit. If they do not work out in the
        first two months or they leave, we source your replacement at zero cost.
    - title: 9 years at scale. 10,000+ employees placed across Europe.
      description: >-
        Built in the UAE, one of the world's most compliance-heavy hiring
        environments. That operational depth now runs recruitment across Spain,
        Germany, Portugal, Poland, and Italy.

# Four steps rather than three, which is why the desktop frame (502:5611) draws
# them 2×2 — `ServiceSteps` takes the column count from the step count. Steps 3
# and 4 reuse the EOR hub's photographs, which is what the frames draw.
howItWorks:
  heading: How Recruitment works?
  steps:
    - title: Tell us what you need to hire
      description: >-
        Role, seniority, location, salary range, urgency. Is this a standard
        role or a specialized search? Are you hiring EU nationals or
        international candidates who need visa support? We assess the complexity
        and give you realistic timelines upfront.
      image: ../../../assets/images/step-role-briefing.webp
      imageAlt: A hiring manager briefing two colleagues across a meeting table
    - title: We source and screen
      description: >-
        We tap our network, use our sourcing tools, and headhunt where needed.
        We screen candidates for fit - skills, experience, culture alignment.
        For international hires, we run initial visa category checks so we only
        present people who can actually work for you. You get a shortlist of
        qualified candidates, not noise.
      image: ../../../assets/images/step-candidate-screening.webp
      imageAlt: A recruiter talking through a shortlist with a colleague at a desk
    - title: You choose. We validate. They onboard.
      description: >-
        You select the candidate you want. Our legal team validates the full
        picture: visa requirements, work permits, non-compete clauses,
        employment agreements that might restrict them. Once validated, they are
        good to onboard. We stay involved through their first weeks to ensure
        the transition goes smoothly.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: A person signing a printed employment contract at a desk
    - title: Payment and the 60-day safety net
      description: >-
        15 days after they start, you pay us 10% of their annual gross salary -
        one-time fee. If the hire does not work out in the first 60 days or they
        decide to leave, we source your replacement at no charge. You already
        paid us; we find the right person the second time.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: A new employee being welcomed through an open-plan workspace
  prompt: Looking to manage recruitment without the legal risks?
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

