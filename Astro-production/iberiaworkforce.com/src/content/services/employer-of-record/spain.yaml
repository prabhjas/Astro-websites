  imageAlt: Colleagues talking in a bright Spanish office
  items:
    - eyebrow: Payroll Administration
      title: Payroll & TGSS Compliance
      description: >-
        Monthly payroll processing with TGSS contributions (employer social
        security), IRPF withholding (income tax), and statutory deductions. All
        handled per Spanish tax law, not approximated from a global template.
    - eyebrow: CBA Classification
      title: CBA Classification & Employment Contracts
      description: >-
        We identify the applicable collective bargaining agreement for each role.
        Contracts are drafted under Spanish labour law with CBA terms locked in
        at hire time.
    - eyebrow: Immigration Support
      title: Work Permits & Visa Support
      description: >-
        Non-EU visas (HQP, Digital Nomad, standard work permits) handled in-house
        with our immigration lawyers. Not outsourced to a third party.
    - eyebrow: Termination Management
      title: Severance & Termination Compliance
      description: >-
        Spanish law requires justified termination. We structure exits to comply
        with notice periods, severance obligations, and unfair dismissal
        protections.

