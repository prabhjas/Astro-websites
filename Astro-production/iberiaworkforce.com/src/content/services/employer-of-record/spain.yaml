intro:
  eyebrow: WHAT IS AN EMPLOYER OF RECORD?
  heading: You hire. We handle everything else.
  paragraphs:
    - >-
      An employer of record is a company that becomes the legal employer of your
      workers. You hire them, direct their work, set compensation. We handle the
      employment contract, payroll processing, taxes, social security, and all
      compliance.
    - >-
      In Spain, an EOR provider must hold an ETT licence to operate legally —
      most global platforms don't.

differentiator:
  layout: stacked
  # 86:58 sets 80px top and bottom, where the dark band normally runs 96/160.
  spacing: compact
  heading: Why Employer of Record works differently in Spain?
  paragraphs:
    - >-
      EOR works fine in countries with shallow employment law. Spain is not one
      of those countries. The gap between getting employment structure right and
      getting it wrong is not small — severance obligations, collective
      bargaining classifications, work permits for non-EU nationals, TGSS
      registration that impacts your costs. These aren't edge cases. These are
      decisions that get made at hire time.
    - >-
      Most global EOR platforms handle these with account managers working from
      a checklist. We handle them with lawyers. That's the difference. When your
      hire needs a Digital Nomad Visa, a Beckham Law tax structure, or a CBA
      classification that doesn't fit the template — those are the cases we built
      this service for. Not edge cases. Our standard cases.
  background: ../../../assets/images/eor-spain-works.webp
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

whyChoose:
  heading: >-
    Why choose Iberia Workforce for Employer of Record services in Spain?
  highlight: Employer of Record
  items:
    - title: We have the licence. Most EOR providers don't.
      description: >-
        Spanish law requires an ETT licence to legally supply workers to a third
        party. We hold it. Global platforms don't. That difference matters.
    - title: We're built for Spain's legal complexity.
      description: >-
        Non-Schengen visas for Chinese, Indian, and other non-EU nationals.
        Beckham Law tax structure. CBA classifications that don't fit the
        template. These aren't edge cases we escalate, they're what we're built
        for.

howItWorks:
  # 219:2192 draws this band on the cream page colour with white cards.
  surface: page
  heading: How Employer of Record works in Spain?
  steps:
    - title: Tell us who you need to hire
      description: >-
        Role, location, start date. EU or non-EU nationality. We assess the
        employment structure and flag compliance considerations upfront.
      image: ../../../assets/images/step-01-brief.webp
      imageAlt: Two colleagues at a Madrid office desk reviewing a document together
    - title: We handle all legal work
      description: >-
        Our lawyers prepare the employment contract under Spanish labour law. We
        register with TGSS. We manage visa or work permit processing if required.
        We classify the role under the applicable collective bargaining
        agreement. You sign off. We execute.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: A person signing a printed employment contract at a desk
    - title: Your employee is live
      description: >-
        We run payroll month to month (TGSS contributions, IRPF withholding,
        CBA-aligned rates). We manage ongoing HR administration. We carry the
        legal exposure for severance, termination, and compliance violations. You
        manage the work.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: A new employee being welcomed through an open-plan workspace
  prompt: Ready to hire in Spain without the legal exposure?
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

