# The Figma accordion is drawn closed: it specifies the seven questions and no
# answers. Both the questions and the answers below are the client's copy, which
# expands several of the questions past the label Figma draws — the design gives
# the order, the client gives the words.
faq:
  eyebrow: EMPLOYER OF RECORD SPAIN
  heading: Frequently asked questions
  items:
    - question: Is employer of record legal in Spain?
      answer: >-
        Yes. EOR is a recognised employment structure in Spanish law. The EOR
        provider must hold an ETT licence to operate legally. We do.
    - question: How does EOR work with Beckham Law in Spain?
      answer: >-
        Beckham Law (the 5-year flat 24% tax regime for new residents) and EOR
        can work together, but they require careful structuring. Your employment
        contract and tax residency status must align to protect Beckham
        eligibility. We ensure that from day one.
    - question: Can you handle HQP and Digital Nomad Visas?
      answer: >-
        Yes. HQP (Highly Qualified Professional) visas and Digital Nomad Visas
        are increasingly common. We handle the visa application, manage payroll
        compliance, and ensure ongoing documentation requirements are met
        throughout the visa term.
    - question: How quickly can I hire someone in Spain?
      answer: >-
        EU nationals with standard documentation: 5–10 business days. Non-EU
        nationals with work permits: longer, depending on visa category and how
        fast the administration processes. We give realistic timelines upfront.
    - question: What about severance in Spain? Is my hire at risk?
      answer: >-
        Spanish law requires justified termination. Unfair dismissal claims can
        be costly. We structure employment from hire to potential exit to protect
        you. If termination is challenged, we have lawyers to defend it.
    - question: Do you handle remote work across borders?
      answer: >-
        If your employee is based in Spain, Spanish law applies. If they're
        remote outside Spain, different rules apply depending on their location
        and visa status. Tell us the scenario and we'll clarify before hire.
    - question: Who is Iberia Workforce? What's your legal structure in Spain?
      answer: >-
        Iberia Workforce operates as an ETT-licensed employer of record in Spain.
        We are based in Barcelona and part of Connect Group. Employment services
        are delivered through an in-house legal structure backed by a Spanish law
        firm with 30 years of employment law experience.

closing:
  heading: >-
    Most hiring problems in Spain aren't complicated. They just need someone who
    actually knows Spanish employment law.
  body: >-
    Tell us what you're trying to do — one hire, visa case, multi-country setup —
    and we'll tell you exactly how it works. No jargon. No surprises.
