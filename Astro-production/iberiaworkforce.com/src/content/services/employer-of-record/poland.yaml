intro:
  heading: What is an Employer of Record in Poland?
  paragraphs:
    - >-
      An employer of record in Poland is a legal structure that becomes the
      formal employer of your workers under a Polish employment contract. You
      direct the work, set the role, manage performance. We handle the employment
      contract in Polish, register with ZUS (Poland's social insurance system),
      manage mandatory retirement savings enrolment, run monthly payroll with
      income tax and social contributions, and carry the legal exposure for
      compliance.
  quote:
    statements:
      - No Polish company registration required.
      - No weeks spent with tax authorities.

differentiator:
  # Cream with no photograph — the only frame so far to argue this point without
  # a navy band behind it. Hence `tone`, and hence no `background` key.
  tone: light
  heading: Why Employer of Record works differently in Poland?
  subheading: The law is clean. The execution is detailed.
  paragraphs:
    - >-
      Polish employment law reads simpler than most places — no Works Council
      politics, no Beckham Law complications. That simplicity tricks foreign
      employers into thinking they don't need lawyers. Then month two hits: a
      retirement savings compliance fine, a tax residency trigger that nobody
      flagged, or a contractor misclassification audit.
    - >-
      Most global EOR platforms treat Poland as a checklist — registration
      number, payroll running, done. We treat it as what it is: cost-efficient
      hiring if you execute it right, catastrophic if you don't. That's why you
      need in-house payroll specialists, not templates.
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

