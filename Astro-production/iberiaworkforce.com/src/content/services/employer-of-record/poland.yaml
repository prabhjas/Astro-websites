# Figma draws the accordion closed and specifies only the questions; the answers
# below were supplied by the client.
faq:
  eyebrow: EMPLOYER OF RECORD POLAND
  heading: Frequently asked questions
  items:
    - question: Is employer of record legal in Poland?
      answer: >-
        Yes. EOR is a recognised employment structure under Polish law. No
        special licence is required to operate as an EOR provider in Poland — the
        compliance responsibility sits on the EOR's execution, not on a
        regulatory credential.
    - question: What exactly is PPK (mandatory retirement savings), and why does it matter?
      answer: >-
        PPK is a mandatory retirement savings programme. Employers must enrol
        eligible employees; you contribute a minimum 1.5% of salary, employees
        contribute 2%. Non-compliance carries fines up to PLN 1,000,000. It sits
        outside standard payroll, so it's where compliance breaks down for
        providers without dedicated payroll teams managing it month to month.
    - question: How much does social security actually cost?
      answer: >-
        Employer social security contributions total roughly 19–21% of gross
        salary on top of base pay. The exact rate depends on the role. We
        calculate it precisely per hire; there's no "approximate" with Polish
        social security.
    - question: What happens if my employee stays more than 183 days in Poland?
      answer: >-
        If they stay more than 183 days in a calendar year, they become a Polish
        tax resident and must file Polish taxes on worldwide income. We flag this
        threshold upfront.
    - question: Can we hire someone remotely and have them work outside Poland?
      answer: >-
        If the work is habitually performed outside Poland, the labour law of
        that country applies, not Polish law. If they're in Poland 183+ days,
        they're a Polish tax resident regardless. Tell us the scenario and we'll
        clarify the tax and labour implications before hire.
    - question: What's the difference between fixed-term and indefinite contracts?
      answer: >-
        Polish law allows fixed-term contracts up to 3 years total (including
        renewals). Indefinite contracts have no end date. Termination notice
        periods differ by tenure, not contract type. We structure the right type
        based on your hiring need.
    - question: Who is Iberia Workforce, and what's your legal structure in Poland?
      answer: >-
        Iberia Workforce operates as an employer of record in Poland through our
        own registered entity based in Warsaw — no local partner intermediary.
        We're part of Connect Group. Our in-house legal and payroll team handles
        your contract, social security filings, and visa work directly.

