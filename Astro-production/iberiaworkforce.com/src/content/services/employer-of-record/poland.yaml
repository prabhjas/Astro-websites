# Employer of Record — Poland country page.
# Figma nodes 414-4528 (1440), 184-1758 (768), 184-1753 (430).
# Renders through src/pages/[...slug].astro -> CountryTemplate.astro.
#
# The third country page, and the one that stretched the shape furthest. Four
# sections take an arrangement no earlier page used, each of them a switch on an
# existing component rather than a new one:
#
#   intro.quote          the slate pull-quote card beside the prose
#   differentiator.tone  the same argument on cream, with no photograph
#   whyChoose.layout     two filled cards instead of a divider list
#   featureList.layout   heading + CTA in their own column, eyebrows as pills
#
# Two sections are genuinely new: `audience` ("who we work with") and
# `pricingSummary`, the third pricing shape — Poland can publish a starting
# number the way Spain can, but it is a floor rather than a flat rate, so the
# cards beside it exist to say what moves it.
