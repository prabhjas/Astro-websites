# The Figma accordion is drawn closed, so it specifies the questions but no
# answers. Copy supplied by the client. Two answers point at the Spain country
# page, which does not exist yet — see the known gaps in CLAUDE.md.
faq:
  eyebrow: EMPLOYER OF RECORD EUROPE
  heading: Frequently asked questions
  items:
    - question: Is employer of record legal in Europe?
      answer: >-
        Yes. EOR is a recognised and widely used employment structure across
        Europe. The legal requirements differ by country - in Spain, for
        example, the law requires an ETT licence to legally supply workers to a
        third party. Most providers don’t hold one. We do. Full details on our
        Spain EOR page.
      link:
        label: Spain EOR
        href: /employer-of-record/spain
    - question: How much does an employer of record cost?
      answer: >-
        Our EOR service in Spain is priced at €299 per employee per month - flat
        rate, no setup fees for standard EU hires. Pricing for other countries
        depends on headcount and employment structure. We provide a full
        breakdown before any commitment. No obligation.
    - question: How quickly can I hire through an EOR?
      answer: >-
        For EU nationals in a standard employment structure, most clients are
        onboarded within a few business days of receiving the necessary
        documents. Non-EU hires or work permit cases take longer, timelines
        depend on the visa category and the employee’s nationality. We will give
        you a realistic estimate upfront, not an optimistic one.
    - question: What’s the difference between an EOR and a PEO?
      answer: >-
        A PEO (Professional Employer Organisation) co-employs workers alongside
        the client company, which requires the client to have a registered
        entity in the country. An EOR employs the worker directly, making it the
        sole legal employer. That distinction matters when you have no local
        entity and don’t want one.
    - question: Can an EOR handle non-EU work permits?
      answer: >-
        Yes. We have in-house immigration lawyers who handle non-Schengen visas,
        work permits, and complex documentation for non-EU nationals. This
        includes nationalities that other providers routinely decline to take
        on.
    - question: Does EOR work alongside the Beckham Law?
      answer: >-
        It can, but the interaction between EOR and the Beckham Law tax regime
        requires careful structuring. The full answer is on our Spain EOR page.
      link:
        label: Spain EOR
        href: /employer-of-record/spain

