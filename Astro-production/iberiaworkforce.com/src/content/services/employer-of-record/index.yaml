definition:
  heading: What is an Employer of Record?
  body: >-
    An employer of record is a company that employs workers on behalf of another
    business. The EOR handles the employment contract, payroll, tax
    registration, and statutory compliance while the client directs the
    day-to-day work. It is the legal route for hiring in a country where you
    have no registered entity and do not want to set one up.
  image: ../../../assets/images/eor-hub-eor-definition.webp
  imageAlt: Two colleagues reviewing a document together on an office terrace

differentiator:
  heading: Hire legally in Europe without setting up a local entity
  paragraphs:
    - >-
      Most global EOR platforms work well enough — until you hit a country where
      the compliance layer actually matters. European labour law is not uniform.
      CBAs, statutory severance, social security structures, work permit
      categories — these vary by country, and the gap between getting it right
      and getting it wrong is not small.
    - >-
      Our EOR is run by in-house lawyers and immigration specialists. Not account
      managers working from a compliance checklist. If you are already with a
      global EOR provider and something has broken down - a visa issue, a
      contract dispute, a compliance gap nobody flagged in time - we get those
      calls regularly. We know what went wrong and how to fix it.
  background: ../../../assets/images/eor-hub-local-entity.webp

