# Figma draws the accordion closed and specifies only the questions; the answers
# below were supplied separately by the client, as Portugal's were. Six of the
# questions arrived worded more fully than the design draws them — "What happens
# after 18 months?" against "…with the same employer of record?", and so on. The
# client's wording is the one used here; the design is the one worth updating.
faq:
  eyebrow: EMPLOYER OF RECORD GERMANY
  heading: Frequently asked questions
  items:
    - question: Is employer of record legal in Germany?
      answer: >-
        Yes. EOR in Germany operates under the AÜG (Arbeitnehmerüberlassungsgesetz)
        as a form of employee leasing. The provider must hold a leasing licence
        issued by the Agentur für Arbeit. We hold ours directly — not through a
        local partner, which would create an illegal chain-leasing arrangement.
    - question: What happens after 18 months with the same employer of record?
      answer: >-
        German law caps continuous leasing to one client at 18 months
        (Höchstüberlassungsdauer), reset only by a genuine break of three months
        and one day. We start planning the transition — contract reset, direct
        hire, or a restructured role — well before month 18, not as a last-minute
        scramble.
    - question: Does a Works Council have to approve my hire?
      answer: >-
        If your company has an elected Betriebsrat, it may have co-determination
        rights over the hire under the Betriebsverfassungsgesetz, and can object
        to certain personnel decisions. We check this before the hire moves
        forward, not after an objection stalls it.
    - question: What happens at nine months under the equal-pay rule?
      answer: >-
        Once a leased employee reaches nine months on the same assignment,
        Germany's equal-pay principle (Gleichstellungsgrundsatz) applies
        automatically — pay and benefits step up to match a comparable internal
        employee at your company. We build that step-up into the hire's budget
        from day one, so month nine isn't new information when it arrives.
    - question: Can an EOR sponsor a Skilled Worker Visa or EU Blue Card?
      answer: >-
        Yes. We handle the application and supporting documentation for the
        Skilled Worker Visa and EU Blue Card in-house, and manage the ongoing
        compliance obligations that come with sponsoring a non-EU hire throughout
        the assignment.
    - question: >-
        Could hiring through an EOR create a tax obligation for my company in
        Germany?
      answer: >-
        For most roles, no — the leasing structure keeps the client outside the
        German tax net. Senior or client-facing roles that make ongoing business
        decisions on German soil are the exception. We help classify the role
        correctly so a hire doesn't inadvertently expose your company to a
        permanent establishment claim.
    - question: What happens if I need to end someone's employment?
      answer: >-
        Full dismissal protection under the Kündigungsschutzgesetz applies
        automatically from month seven at companies with more than ten employees.
        Outside probation, terminations need documented, justified grounds. We
        structure the process to hold up if challenged.
    - question: Who is Iberia Workforce, and what's your legal structure in Germany?
      answer: >-
        Iberia Workforce holds the AÜG leasing licence directly for Germany,
        issued by the Agentur für Arbeit — no local partner sits in that licensing
        chain, which is the exact gap flagged earlier on this page. We're part of
        Connect Group.

closing:
  heading: >-
    German employment law runs on deadlines, month seven, month nine, month
    eighteen, not on judgment calls.
  body: >-
    Missing one isn't a minor slip; it's a compliance violation with a fine
    attached. Describe the hire, and we'll map the AÜG structure, the Works
    Council process if one applies, and every deadline your business needs to
    track.
