        work with EOR structures and which don't.
    - title: Immigration lawyers, not coordinators.
      description: >-
        Non-EU hires aren't a side job for us. We have lawyers who specialize in
        Italian work visas and understand what makes an application succeed or
        fail. No third parties, no 'we'll check with our local partner.'
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

