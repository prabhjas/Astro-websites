      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: A new employee being welcomed through an open-plan workspace
  prompt: Ready to hire in Italy without the legal exposure?
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

included:
  # The icon grid rather than Spain's photo-and-list, and in the `aside`
  # arrangement: the heading and the button hold their own column at 1440,
  # while both narrow frames put the heading on top and the button at the
  # bottom. Every card carries the same `verified` mark, because these six are
  # a list of what is covered rather than six different things.
  layout: aside
  surface: surface
  columns: 3
  heading: What's included in Employer of Record services in Italy?
  items:
    - icon: verified
      title: Employment Contracts Under Italian Law & CCNL Compliance
      description: >-
        Written in Italian, structured to meet Italian legal requirements and
        mapped to the correct CCNL for your industry. Includes mandatory minimum
        salary rules, leave entitlements, severance clauses, and notice periods.
        Not a global template adapted for Italy. A contract built for Italy.
    - icon: verified
      title: Payroll & INPS Registration
      description: >-
        Monthly payroll with INPS contributions (employer social security),
        income tax withholding, and all deductions calculated correctly under
        Italian law. Setup with INPS and ongoing monthly filings.
    - icon: verified
      title: TFR Severance Accrual & Management
      description: >-
        Italian law requires employers to accrue severance (TFR) throughout
        employment — approximately 7.4% of salary set aside monthly. We track
        and manage this so the final settlement is calculated correctly and paid
        when employment ends.
    - icon: verified
      title: Additional Salary Months
      description: >-
        Italian law requires extra salary payments beyond the base 12 months
        (typically 13th and 14th month bonuses). We calculate and process these
        correctly per the CCNL for your role.
    - icon: verified
      title: Visa Support for Non-EU Hires
      description: >-
        Non-EU visa applications, visa timing coordination, and documentation
        management so your hire gets approved when the application window is
        open. No delays because paperwork was missing or didn't match your
        employment contract.
    - icon: verified
      title: Termination & Severance Management
      description: >-
        Italian employment law requires justified grounds for termination. We
        structure exits so they comply with Italian law, calculate final
        severance correctly, and don't expose you to disputes.
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

