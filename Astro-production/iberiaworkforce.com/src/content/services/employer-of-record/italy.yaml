# Employer of Record — Italy country page.
# Figma nodes 128-1141 (1440), 184-1761 (768), 184-1750 (430).
# Renders through src/pages/[...slug].astro -> CountryTemplate.astro.
#
# The fifth country page, and the last EOR market. It needed no new section —
# only three switches on components earlier pages had already generalised:
#
#   differentiator.align  the dark split run from the top rather than centred
#   whyChoose.cta         a button hung off the claim's column
#   included.layout       the icon grid with the heading and CTA in an aside
#
# The one genuinely new asset is the `verified` glyph, which the frames draw
# six times over rather than giving each obligation its own icon.
