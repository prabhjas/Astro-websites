intro:
  heading: What is an Employer of Record in Italy?
  paragraphs:
    - >-
      In Italy, an employer of record is a company that becomes the legal
      employer of your workers. You hire them, direct their work, set what they
      do. We handle the employment contract under Italian law, register them
      with INPS, run their payroll each month, manage visa applications if
      needed, and carry the legal responsibility if something goes wrong. No
      Italian company registration needed on your end.

differentiator:
  # The dark split, as the hub draws it — but run from the top rather than
  # centred: the claim is three lines against seven of prose, and centring
  # drops it ~100px below the copy it introduces.
  align: start
  heading: Why Employer of Record works differently in Italy?
  paragraphs:
    - >-
      Italian employment law is strictly regulated from day one. There's no
      statutory minimum wage set nationally — instead, your industry determines
      your legal minimum salary through the CCNL. You also have to accrue TFR
      (severance) throughout employment, plus INPS contributions (social
      security), mandatory extra salary months, and strict termination rules.
    - >-
      Foreign employers miss these requirements because they're used to
      countries with simpler rules. They use the same contract template
      everywhere — then the visa gets rejected because the contract doesn't
      match the CCNL rules for that industry. The payroll is wrong because they
      didn't budget for TFR and INPS. The termination gets challenged because
      they didn't follow Italian dismissal procedures. Most global EOR platforms
      catch these issues after the fact. We catch them before you sign anything.
  background: ../../../assets/images/contour-map-europe.webp

whyChoose:
  # The claim and its button travel with the reasons, as the homepage does it.
  sticky: true
  heading: >-
    Why choose Iberia Workforce for Employer of Record services in Italy?
  items:
    - title: >-
        We know where global EOR templates break down — specifically in CCNL
