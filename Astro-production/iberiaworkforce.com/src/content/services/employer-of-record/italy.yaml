  tone: light
  heading: Employer of Record in Italy
  subheading: >-
    Hire employees without setting up a company. We handle the legal part that
    gets complicated.
  badges:
    - icon: law
      label: Law Firm Backed
    - icon: institute
      label: Italian Employment Lawyers
    - icon: money
      label: On-Ground Payroll Team
  body: >-
    Italian employment law doesn't just require compliance — it requires knowing
    the CCNL (industry salary rules), INPS registration (social security), TFR
