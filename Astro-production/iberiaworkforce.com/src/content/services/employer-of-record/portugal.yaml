    label: Get a Cost Breakdown for your Hire
    href: "#contact-form"

pricingNote:
  heading: Employer of Record pricing in Portugal
  paragraphs:
    - >-
      We don't quote a flat number for Portugal, because the variables that
      actually move your cost — EU or non-EU hire, visa category, role
      classification under the collective agreement — change the structure enough
      that a flat rate would either overcharge simple hires or undercharge
      complex ones.
    - >-
      What you'll always get before committing to anything: a full breakdown of
      the base fee, payroll costs including the 14-month structure, the meal
      allowance range for your working pattern, and mandatory insurance — no
      separate line items that show up later.
  background: ../../../assets/images/eor-portugal-azulejo.webp
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

# Figma draws the accordion closed and specifies only the questions; the answers
# below were supplied by the client.
faq:
  eyebrow: EMPLOYER OF RECORD PORTUGAL
  heading: Frequently asked questions
  items:
    - question: Is employer of record legal in Portugal?
      answer: >-
        Yes. EOR is a recognised, legally established route to hiring in
        Portugal. There's no special license required to operate as a provider
        here — the complexity sits inside the Código do Trabalho itself, not in a
        licensing regime.
    - question: How much does an employer of record cost in Portugal?
      answer: >-
        It depends on headcount, contract type, and whether the hire needs visa
        sponsorship. Portugal's cost structure has too many moving parts for a
        single flat number to be honest. Tell us your scenario and we'll walk you
        through exactly what it costs.
    - question: How quickly can I hire someone in Portugal?
      answer: >-
        EU/EEA nationals with standard documentation: typically 1–2 weeks. Non-EU
        hires needing a D1, D3, or Blue Card add further weeks while AIMA
        processes the residence permit — the exact timeline depends on visa
        category and nationality. We give you a realistic estimate, not an
        optimistic one.
    - question: Can I use an EOR if my hire is on a Digital Nomad (D8) Visa?
      answer: >-
        Not exactly, and this is worth being direct about. The D8 is built for
        people who remain employed by a company outside Portugal; it isn't
        designed around a Portugal-based EOR relationship. If your hire needs to
        be a genuine Portugal employee, D1 or D3 is usually the correct route
        depending on their qualifications. We'll tell you which structure
        actually fits your situation rather than forcing a hire into whichever
        visa is easiest to process.
    - question: What happens if I need to end someone's employment?
      answer: >-
        Portugal doesn't recognize at-will termination. Every dismissal needs
        documented, justified grounds — disciplinary cause, redundancy, or mutual
        agreement. In practice, it's a missed procedural step that gets a
        dismissal successfully challenged, not the underlying decision. We build
        that process discipline into the contract from the start, not as cleanup
        afterward.
    - question: Why does my monthly payroll cost vary?
      answer: >-
        Mainly the meal allowance — it's paid per day actually worked, so a month
        with vacation or leave will show a lower total than a full working month.
        We flag this upfront so it's never a surprise on the invoice.
    - question: Who is Iberia Workforce, and what's your legal structure?
      answer: >-
        Iberia Workforce is part of Connect Group. There's no local intermediary
        between you and the people doing the work — the same team drafting your
        contract, running payroll, and filing visa paperwork with AIMA is who
        you're in contact with throughout.

closing:
  heading: You don't need to become an expert in the Código do Trabalho.
  subheading: You need someone who already is.
  body: >-
    Every scenario on this page starts the same way: describe the hire, and we'll
    map the visa route, the contract terms, and the real monthly cost before you
    commit to anything.
