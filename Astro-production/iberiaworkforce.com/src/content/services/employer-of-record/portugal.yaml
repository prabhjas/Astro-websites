    Employer of record services in Portugal. Código do Trabalho compliance,
    non-EU visa support, transparent payroll costs. Run by lawyers, not
    templates.
  schema:
    serviceName: Employer of Record Services Portugal
    serviceType: Employer of Record
    areaServed: Portugal
    # No address: the brief marks this page's office location PENDING, and an
    # invented city in structured data is worse than an absent one. Add it
    # here when the client confirms.

