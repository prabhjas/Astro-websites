intro:
  heading: What is an Employer of Record in Portugal?
  image: ../../../assets/images/eor-portugal-definition.webp
  imageAlt: Two colleagues talking over a laptop in a Lisbon office
  paragraphs:
    - >-
      In Portugal, an employer of record is a legal structure that handles the
      employment contract under the Código do Trabalho, manages the mandatory
      14-month salary system, coordinates work permits for non-EU hires, and
      carries the compliance risk for strict termination procedures — while you
      retain operational control of the day-to-day work.

differentiator:
  layout: statements
  heading: Why Employer of Record works differently in Portugal?
  paragraphs:
    - >-
      Portugal's labor code doesn't leave much room for improvisation. The
      14-month salary system, strict probation and termination rules, collective
      bargaining coverage, work permits for non-EU hires — these aren't details
      you patch after the hire is made. They're decisions that lock in your legal
      exposure from day one.
    - >-
      A checklist doesn't catch what happens when a probation period ends and the
      termination gets contested, or when a non-EU hire's visa category doesn't
      match the role you're actually offering. Ours is a legal team, not a
      support queue — the people structuring your contract are the same people
      who'd defend it if it were ever challenged.
  prompt: >-
    Book a 20-min call to clarify which probation window applies to your hire?
  background: ../../../assets/images/eor-portugal-lisbon-office.webp
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

whyChoose:
  heading: >-
    Why choose Iberia Workforce for Employer of Record services in Portugal?
  highlight: Employer of Record
  items:
    - title: We match the hire to the right visa track.
      description: >-
        D1, D3, the EU Blue Card, a foreign-employer arrangement — each fits a
        different reality, and the wrong one gets challenged at AIMA, not on our
        end. We tell you which one you need before you commit to it.
    - title: >-
        We build contracts that survive a challenge, not just contracts that get
        signed.
      description: >-
        Probation length, CBA classification, grounds for termination — set at
        hire time, rarely revisited until something goes wrong. Getting these
        right from day one is what keeps a termination from turning into a legal
        dispute months later.

howItWorks:
  # Cream rather than white here: the bands either side of it are white, so this
  # is what keeps the page alternating. The Spain page is the other way round.
  surface: page
  heading: How Employer of Record works in Portugal?
  steps:
    - title: Tell us about the hire
      description: >-
        Role, salary, start date, and whether this person lives in Portugal or
        needs a visa. For non-EU hires, we confirm upfront whether D1, D3, the EU
        Blue Card, or a different route actually applies — before any paperwork
        starts.
      image: ../../../assets/images/step-01-brief.webp
      imageAlt: Two colleagues at an office desk reviewing a document together
    - title: We build the contract and register
      description: >-
        Employment contract under the Código do Trabalho, Segurança Social
        enrolment, the applicable collective bargaining classification, and visa
        or residence permit processing if needed. You approve the terms. We
        handle the filing.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: A person signing a printed employment contract at a desk
    - title: Your employee starts
      description: >-
        Monthly payroll accounts for the 14-month salary structure and the meal
        allowance, tracked per day actually worked. Probation, performance, and
        if it ever comes to it, termination — we manage the process so it holds
        up.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: A new employee being welcomed through an open-plan workspace
  # Figma's prompt here still reads "Ready to hire in Spain…" at all three
  # widths — a leftover from the Spain frame it was duplicated from.
  prompt: Ready to hire in Portugal without the legal exposure?
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

