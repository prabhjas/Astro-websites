        your one Staff Outsourcing agreement.
    - icon: envelope-seal
      title: Ad-hoc project staffing
      description: >-
        Need a specialist for two weeks? A compliance auditor for a three-week
        inspection? We source project-based staff, manage contracts with clear
        end dates, and off-board correctly when work ends.
    - icon: gavel
      title: Employment contracts under local law
      description: >-
        Permanent, seasonal, and project contracts drafted to comply with
        employment law in each country where staff are deployed. Role
        classifications and compensation locked in at the start.
    - icon: money-roll
      title: Payroll processing and social security registration
      description: >-
        Monthly payroll with statutory contributions, tax withholding, and
        statutory deductions, all calculated per local law. Registration and
        filings handled directly with relevant authorities.
    - icon: person-case
      title: HR administration and leave management
      description: >-
        Annual leave accrual, sick leave, statutory days off, tracked and
        adjusted in payroll. Contract amendments, employee records, policy
