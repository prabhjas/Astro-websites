        workforce operates under Iberia compliance umbrella.

faq:
  eyebrow: STAFF OUTSOURCING
  heading: Frequently asked questions
  items:
    - question: >-
        What is the difference between Staff Outsourcing and Temporary
        Staffing?
      answer: >-
        Temporary staffing is fixed-term. You need 10 workers for August
        harvest, done. Staff outsourcing is ongoing. You have permanent staff,
        seasonal peaks, and ad-hoc projects - all under one agreement. We
        employ everyone. You direct the work continuously, not just for a
        defined period.
    - question: Can we transfer our existing employees to Iberia?
      answer: >-
        Yes. That is one of the core scenarios Staff Outsourcing solves. You
        have people. You do not want them on your books anymore. We take them
        onto Iberia books. Same people, same work, different legal employer.
        Contract review, payroll setup, social security transition - all
        handled so the transfer is seamless.
    - question: How does seasonal variation work? Do we pay for off-peak months?
      answer: >-
        Depends on your contract structure. For permanent staff who are part of
        your core team, yes, they stay on payroll even in slow months (unless
        you restructure). For purely seasonal workers, they are on payroll only
        during the peak, we only bill when they are working. Pricing is custom
        because the mix of permanent vs. seasonal vs. ad-hoc varies per
        business.
    - question: What happens if we need to terminate someone?
      answer: >-
        Employment law requires documented, justified grounds for termination -
        not at-will. We manage the exit process. We assess whether the grounds
        are defensible under local law, we structure the termination to comply
        with notice periods and severance, we calculate the final payment, and
        if the dismissal gets challenged, we defend it legally. You do not
        handle any of this.
    - question: Can we use Staff Outsourcing alongside other services?
      answer: >-
        Yes. You can Staff Outsource your existing team, then use EOR to hire
        new permanent employees in a country with no local entity. One
        agreement per service, but they work together because we manage the
        whole picture.
    - question: How is Staff Outsourcing pricing determined?
      answer: >-
        Custom per scenario. Headcount (permanent, seasonal, ad-hoc), tenure
        mix, industry, and whether you need Iberia to source workers all affect
        the cost. We provide a full breakdown before you commit, no hidden line
        items, no surprise bills.
    - question: Is Staff Outsourcing legal across Europe?
      answer: >-
        Yes. Outsourcing your workforce to a licensed employment provider is a
        recognized employment structure. The compliance responsibility sits on
        the provider execution, which is why you need a partner who knows
        employment law and termination procedures.
    - question: Who is Iberia Workforce?
      answer: >-
        Iberia Workforce is part of Connect Group. We operate Staff Outsourcing
        services through our own registered entities in each country. Our
        employment lawyers and payroll specialists handle all staff takeovers,
        sourcing, contracts, payroll, HR administration, and compliance
        directly. We carry the legal and employment risk.

closing:
  heading: >-
    You do not need to become an employment law expert just to have a flexible,
    seasonal workforce.
  # 18px in all three frames, where the country pages set this at H3 — the
  # argument has already been made by the time the reader reaches it.
  bodySize: note
  body: >-
    European termination complexity, role classification headaches, payroll
    calculations — these should not be your problem. Describe your workforce
    structure — how many permanent, your seasonal swings, any ad-hoc project
    needs — and we will tell you exactly how Staff Outsourcing works for your
    business, what it costs, and how quickly we can take over.
