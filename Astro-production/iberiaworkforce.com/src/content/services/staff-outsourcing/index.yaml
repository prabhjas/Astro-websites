intro:
  heading: What is Staff Outsourcing?
  # Display scale, so the claim keeps the whole 768 frame and the prose
  # follows under it — which is what 537:6583 draws.
  headingScale: display
  paragraphs:
    - >-
      Staff outsourcing is the delegation of your workforce to an external
      employer. You have people who work for your business - permanent staff,
      seasonal workers for peaks, specialists for projects. Iberia becomes the
      legal employer of all of them. You continue to direct their work, set
      roles, manage performance. Iberia handles employment contracts, payroll,
      social security registration, HR administration, and the compliance risk
      if something goes wrong. You get workforce flexibility without becoming
      an employment law expert.

definition:
  layout: prose
  eyebrow: STAFF OUTSOURCING
  heading: Why Staff Outsourcing matters?
  image: ../../../assets/images/staff-outsourcing-hub-why-matters.webp
  imageAlt: >-
    A man working at a laptop in an open-plan office, a colleague at a desk
    behind him
  paragraphs:
    - >-
      European employment law does not allow at-will termination. Firing
      requires documented grounds, notice periods, severance calculations, and
      exposure to unfair dismissal claims if executed incorrectly. Most
      companies either hire HR staff to manage this (1,500-2,500 EUR/month
      overhead) or muddle through and pay fines when they get it wrong.
    - >-
      Then there is seasonal variation. Agriculture, retail, logistics,
      hospitality - headcount swings 30-50 percent between peak and off-peak.
      Scaling up and down without legal friction is nearly impossible if you
      are the employer of record.
    - >-
      Staff outsourcing solves both. You do not need an HR department. You do
      not manage terminations. Permanent core, seasonal peaks, ad-hoc projects,
      all under one agreement, one employer, one compliance responsibility.

whyChoose:
  # The claim travels with the reasons, as the homepage does it.
  sticky: true
  heading: Why choose Iberia Workforce for Staff Outsourcing services?
  highlight: Staff Outsourcing
  # The divider run on the cream page colour — every earlier `list` frame is
  # white, and what keeps this page alternating is the white band above it.
  surface: page
  items:
    - title: We take on your existing team. You do not restructure.
      description: >-
        You already have people working for you. You do not want them on your
        books anymore - you want someone else managing payroll, contracts, and
        termination risk. We take them onto Iberia books. Same people, same
        work, different legal employer. No disruption.
    - title: We source the rest. Permanent, seasonal, or ad-hoc.
      description: >-
        You need 5 permanent engineers. You need 20 seasonal workers for a
        peak. You need 1 specialist for a three-week project. We source all of
        it under one Staff Outsourcing agreement - same contract structure,
        same compliance, same legal responsibility.
    - title: One agreement. Permanent plus seasonal plus ad-hoc. No service juggling.
      description: >-
        Unlike temporary staffing (fixed-term deployments) or EOR (new
        permanent hires), Staff Outsourcing is your ongoing workforce partner.
        All scenarios covered. No need to bounce between providers or service
        models.
    - title: >-
        We carry the termination risk. European employment law complexity
        becomes our problem.
      description: >-
        When someone needs to leave end of season, project completion,
        performance issue, we handle it. We assess whether grounds are
        defensible under local law, we structure the termination correctly, we
        calculate severance accurately, and we defend the decision if
        challenged. You do not become an employment law expert.
    - title: We are run by employment lawyers, not just recruiters or HR coordinators.
      description: >-
        Termination procedures, employment classification, compliance risk -
        these are legal questions. We have in-house expertise to get them right
        from day one.
    - title: 9 years at scale. 10,000+ employees managed across Europe.
      description: >-
        Built in the UAE, one of the worlds most compliance-heavy employment
        environments. That operational depth now runs Staff Outsourcing in
        Spain, with expansion across Europe.

