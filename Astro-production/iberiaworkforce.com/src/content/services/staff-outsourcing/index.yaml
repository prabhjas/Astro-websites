  heading: How Staff Outsourcing works?
  steps:
    - title: Tell us about your workforce structure
      description: >-
        How many permanent staff do you have now? What is your seasonal peak
        and trough? Do you have ad-hoc project needs? We assess your headcount
        mix and flag any compliance considerations upfront.
      image: ../../../assets/images/step-01-brief.webp
      imageAlt: Two colleagues reviewing a document together at an office desk
    - title: We take on your team and fill the gaps
      description: >-
        Your existing staff transfer onto Iberia books. We run payroll, manage
        contracts, and assume employment responsibility. For seasonal workers
        and project staff, we source them. All under one Staff Outsourcing
        agreement.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: A person signing a printed contract at a desk
    - title: You direct work. We manage everything else.
      description: >-
        Monthly payroll runs. HR administration stays in our hands. Seasonal
        workers ramp up and down as you need. When anyone needs to leave -
        season end, project completion, performance issue - we manage the exit
        legally and correctly. You focus on your business.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: A new employee being welcomed through an open-plan workspace
  prompt: Looking to manage staff outsourcing without the legal risks?
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

