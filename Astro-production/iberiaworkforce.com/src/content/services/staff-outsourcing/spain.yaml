# The fourth pricing shape: no number, but the things that would decide one.
pricingVariables:
  heading: Staff outsourcing pricing in Spain
  body: >-
    Our pricing depends on your workforce structure, CBA complexity, and whether
    we are sourcing seasonal or ad-hoc staff.
  card:
    heading: "Key pricing variables:"
    items:
      - >-
        Permanent headcount and CBA classification complexity (some industries
        have one CBA; others have multiple)
      - Seasonal headcount and duration (peak months vs. year-round core)
      - Ad-hoc project needs and specialization
      - >-
        TGSS contributions and statutory obligations (roughly 30 percent on top
        of gross salary per employee)
      - >-
        Whether we source workers (recruitment cost) or you provide candidates
        for Iberia employment
    footnote: >-
      We provide a full breakdown before you commit, no hidden fees, no surprise
      invoices, no approximations.
    cta:
      label: Get a Custom Quote
      href: "#contact-form"
  image: ../../../assets/images/staff-outsourcing-spain-pricing.webp
  imageAlt: A woman reading a tablet in a modern office

# The design draws the accordion closed and specifies only the questions; the
# answers below are the client's copy, supplied separately.
faq:
  eyebrow: STAFF OUTSOURCING IN SPAIN
  heading: Frequently asked questions
  items:
    - question: How is Staff Outsourcing different from Temporary Staffing in Spain?
      answer: >-
        Temporary staffing covers a fixed period, you need 15 pickers for the
        Christmas peak, and the relationship ends when the season does. Staff
        Outsourcing isn't tied to an end date. It covers your permanent core,
        seasonal swings, and project work together, under one ongoing agreement,
        for as long as you need it.
    - question: Can we move our existing Spanish employees onto Iberia's payroll?
      answer: >-
        Yes, this is one of the most common reasons companies use this service.
        Your team keeps their roles and manager; only the legal employer changes
        on paper. We review their current contracts, confirm which Convenio
        applies, migrate TGSS registration, and take over payroll from the next
        cycle.
    - question: >-
        How do you handle CBA classification when staff fall under different
        Convenios?
      answer: >-
        We assess each role category upfront and identify which Convenio
        Colectivo applies. A logistics company might have permanent supervisory
        staff under one CBA and seasonal warehouse workers under another. We
        classify each group correctly, lock in the salary minimums and working
        rules per agreement, and ensure payroll runs under the right framework.
        This is done before anyone transfers onto Iberia books, so there are no
        audit surprises later.
    - question: What happens to our existing payroll and TGSS registrations?
      answer: >-
        We review your current registrations and CBA classifications. If
        anything is misaligned, we flag it. We then take over TGSS registration
        with the regional office, set up new payroll processing under the
        correct Convenios, and manage the transition so there is no gap in
        coverage or compliance. Your team keeps getting paid on time without any
        disruption.
    - question: Do we pay for staff during off-peak months?
      answer: >-
        It depends on the role. Permanent staff stay on payroll year-round as
        part of your core team. Seasonal workers are only on payroll for the
        period they're contracted, you're not paying for headcount you're not
        using. Because the mix is different for every business, we quote based
        on your actual structure rather than a flat rate.
    - question: What happens if we need to end someone's employment?
      answer: >-
        Spanish law doesn't allow at-will termination, dismissal needs
        documented, justified grounds, whether that's redundancy, conduct, or a
        role ending. We assess whether the grounds hold up, prepare the required
        documentation, calculate the settlement, and manage the process end to
        end. If the dismissal is challenged afterward, we handle that too.
    - question: Can we use Staff Outsourcing alongside EOR or other services?
      answer: >-
        Yes. You can Staff Outsource your existing permanent and seasonal team,
        then use EOR to hire new permanent employees in a country with no local
        entity. Or use Recruitment to source a new permanent role for the same
        team. Each runs as its own agreement, coordinated by the same people who
        already know your workforce.
    - question: Is Staff Outsourcing legal in Spain?
      answer: >-
        Yes. Delegating employment to a licensed provider is a recognized
        structure under Spanish law. There's no special outsourcing licence
        required, the responsibility sits on getting the execution right:
        correct Convenio classification, TGSS registration, and termination
        procedure. That's where providers without dedicated legal teams tend to
        fall short.
    - question: >-
        How quickly can we transition our existing team to Staff Outsourcing?
      answer: >-
        Typically 2–3 weeks from contract signature to takeover, depending on
        documentation readiness and TGSS registration complexity. We handle
        contract review, payroll data migration, CBA classification
        confirmation, and formal TGSS transition. We stay in close contact with
        your team to ensure there are no payroll gaps or compliance lapses
        during handover.
    - question: What if our business grows and we need to hire more permanent staff?
      answer: >-
        We can source new permanent hires for your Staff Outsourcing agreement,
        they come onto Iberia's books under the correct CBA from day one. Or you
        can use our EOR or Recruitment services to place new hires. Everything
        coordinates under one relationship.
    - question: What compliance documentation do we need to keep?
      answer: >-
        We maintain all employment records, CBA classifications, payroll
        calculations, TGSS filings, and termination documentation. We provide you
        with regular reporting so you have visibility, and we handle all
        government filings. If audited, we defend the compliance record.
    - question: Who is Iberia Workforce, and what is your legal structure in Spain?
      answer: >-
        Iberia Workforce is part of Connect Group. We operate Staff Outsourcing
        services in Spain from our Barcelona office through our own registered
        entity, no local partner intermediaries. Our employment lawyers and
        payroll specialists handle workforce takeovers, CBA classification,
        contracts, TGSS registration, payroll processing, HR administration, and
        termination directly. We carry the legal and compliance risk so you do
        not have to.
    - question: Can we scale our outsourced team across multiple Spanish regions?
      answer: >-
        Yes. If you have operations in Barcelona, Madrid, Valencia, and Seville,
        we manage payroll and compliance across all regions. TGSS registrations,
        regional tax variations, and local Convenio nuances, all handled
        correctly. No approximation, no one-size-fits-all approach.

closing:
  heading: >-
    Getting the Convenio right at the start is what keeps this simple later.
  # 18px, not the H3-scale lead: the frame runs the paragraph to five lines
  # under a claim that has already made the argument.
  bodySize: note
  body: >-
    Misclassify a role and you're looking at retrospective pay adjustments;
    classify it correctly and payroll, leave, and severance all just follow the
    rules that already apply. Tell us your headcount split, permanent, seasonal,
    project, and we'll confirm which Convenios apply, walk you through what the
    transition looks like, and give you a real cost before you commit to
    anything.
