label: Staff Outsourcing in Spain

seo:
  title: Staff Outsourcing in Spain | Iberia Workforce
  description: >-
    Staff outsourcing in Spain. We employ your team, classify each role
    under the right CBA, run payroll, and carry termination risk.
  schema:
    serviceName: Staff Outsourcing Services Spain
    serviceType: Staff Outsourcing & Workforce Management
    areaServed: Spain
    address:
      locality: Barcelona
      country: Spain

hero:
  tone: light
  heading: Staff Outsourcing in Spain
  subheading: One legal employer for your permanent, seasonal, and project Staff
  badges:
    - icon: employee
      label: CBA Classification Experts
    - icon: law
      label: Law Firm Backed
    - icon: talk
      label: Termination Handled In-House
    - icon: global
      label: Barcelona-Based
  body: >-
    Different roles usually sit under different Convenios, most companies never
    check. We classify each one correctly, employ your whole team under Spanish
    law, and carry the termination risk when someone leaves. You keep running
    the business.
  # One crop rather than the trio: only the 1440 frame exists for this page, so
  # `ServiceHero` falls back to it at every width and paints its full cream
