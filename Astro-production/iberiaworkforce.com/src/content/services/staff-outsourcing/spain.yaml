# Staff Outsourcing — Spain country page.
# Figma node 169-1483 (1440). No 768 or 430 frame was supplied for this page,
# so the narrow layouts are the ones the shared components already draw for
# every other country page rather than anything measured — see CLAUDE.md.
# Renders through src/pages/[...slug].astro -> CountryTemplate.astro.
#
# The first page in the Staff Outsourcing category, and the first to use
# `pricingVariables` — the fourth pricing shape, documented in
# content.config.ts. Everything else is a switch that already existed.
