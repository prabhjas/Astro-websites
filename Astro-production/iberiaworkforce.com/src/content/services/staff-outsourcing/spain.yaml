# Display scale, so the claim holds the whole left half of the band and the two
# columns stay stacked until desktop.
intro:
  heading: What is Staff Outsourcing in Spain?
  headingScale: display
  paragraphs:
    - >-
      In Spain, staff outsourcing means Iberia becomes the formal employer for
      your permanent staff, seasonal workers, and project specialists, each
      classified under the Convenio Colectivo that actually applies to their
      role. You keep directing the work: assigning tasks, setting priorities,
      managing performance. We take on the legal side: contracts under Spanish
      labour law, TGSS registration, monthly payroll, and the termination
      process if someone needs to leave. No local HR department required on your
      end.

# The navy band with the Iberian contour artwork bleeding in from the right —
# the same arrangement, and the same artwork, as the EOR Spain page.
differentiator:
  layout: stacked
  heading: Why Staff Outsourcing matters in Spain?
  subheading: The CBA classification problem you did not know you had
  paragraphs:
    - >-
      A permanent supervisor and seasonal warehouse staff rarely sit under the
      same Convenio Colectivo, different salary minimums, different overtime
      tiers, different severance rules. Most companies do not check. They assume
      one framework applies to everyone, then an audit catches the mismatch
      months later and they owe retrospective adjustments.
    - >-
      Termination adds a second layer. Spanish law requires documented grounds,
      correct notice periods, and severance calculated per the applicable CBA —
      get any of it wrong and you are exposed to an unfair dismissal claim.
      Staff Outsourcing solves both from day one: we classify every role
      correctly before anyone transfers, and we carry the termination risk when
      someone needs to leave.
  background: ../../../assets/images/eor-spain-works.webp
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

whyChoose:
  # The claim travels with the reasons, as the homepage does it.
  sticky: true
  heading: >-
    Why choose Iberia Workforce for Staff Outsourcing services in Spain?
  highlight: Staff Outsourcing
  items:
    - title: We reclassify as your team changes, not just at the start.
      description: >-
        A seasonal role that becomes permanent, a warehouse worker who moves
        into a supervisory position, the applicable Convenio can change with the
        role. We review classification whenever your team's structure shifts,
        not just once at onboarding.
    - title: Your team stays exactly as it is, we just become their legal employer.
      description: >-
        Nobody changes desks, roles, or manager. We move your existing staff
        onto Iberia's registered entity, migrate their TGSS registration, and
        take over payroll from the next cycle. The only thing that changes is
        who is legally responsible for getting it right.
    - title: >-
        We source seasonal and project staff already matched to the right
        Convenio.
      description: >-
        Whether it's 20 warehouse workers for August or a specialist for a
        three-week audit, we bring people in under contracts built for their
        specific role category from day one, not generic templates adjusted
        later.
    - title: Severance gets calculated against the right Convenio, not an average.
      description: >-
        Notice periods and severance minimums vary by CBA and by tenure. When
        someone leaves, we calculate the settlement against the agreement that
        actually applies to their role, not a flat percentage that undercounts
        what is legally owed.
    - title: Convenio interpretation is a legal call, not an HR checklist item.
      description: >-
        Whether a role falls under one Convenio or another isn't always obvious,
        it takes someone who reads Spanish labour law for a living, not someone
        following a lookup table. That's who classifies your team and defends it
        if questioned.
    - title: >-
        9 years and 10,000+ employees managed across Europe — Spain is the
        newest market, not the first.
      description: >-
        We built this operating model in the UAE, one of the most
        compliance-heavy employment environments globally. Spain is where we're
        applying it now.

# Cream, so the band sits between the white "why choose" list and the white
# "what's included" grid.
howItWorks:
  heading: How Staff Outsourcing works in Spain?
  surface: page
  steps:
    - title: Tell us about your team and how it's currently classified
      description: >-
        Headcount by category, permanent, seasonal, project-based, plus how each
        group is currently paid and under which agreement, if you know it. If
        you're not sure which Convenio applies to a role, that's normal;
        identifying it is the first thing we do.
      image: ../../../assets/images/step-01-brief.webp
      imageAlt: Two colleagues at a Madrid office desk reviewing a document together
    - title: We confirm classification, then move your team over
      description: >-
        Each role gets matched to its Convenio before anything transfers.
        Existing staff move onto Iberia's entity with contracts reviewed and
        TGSS registration updated. Any seasonal or project gaps get filled
        through our own sourcing, on the same agreement.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: A person signing a printed employment contract at a desk
    - title: Payroll runs correctly, and exits get handled properly
      description: >-
        Each Convenio's pay rates, bonuses, and leave rules are applied
        automatically every month. Seasonal headcount scales with your calendar.
        And when someone's time with you ends, we manage the notice period,
        severance calculation, and paperwork so it holds up if questioned.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: A new employee being welcomed through an open-plan workspace
  prompt: Looking to manage staff outsourcing in Spain without the legal risks?
  cta:
    label: Talk to a Specialist
    href: "#contact-form"

