# The Figma accordion is drawn closed, so it specifies the questions but no
# answers. Copy supplied by the client alongside the design.
faq:
  eyebrow: SELECCIÓN DE PERSONAL
  heading: Preguntas frecuentes
  items:
    - question: ¿Cuánto tarda realmente un proceso de selección?
      answer: >-
        Perfiles estándar (nivel medio en fintech, IT, ingeniería, product
        management): 1–2 semanas desde el brief hasta la shortlist. Perfiles
        especializados o de nicho (investigadores de IA, expertos de dominio,
        combinaciones de competencias poco frecuentes): hasta un mes, porque
        la bolsa de candidatos es más pequeña y somos selectivos. Te damos un
        plazo realista de antemano según tu puesto concreto, no uno
        optimista.
    - question: ¿Qué significa exactamente «validación jurídica»? ¿Ralentizáis la contratación?
      answer: >-
        No. No validamos a todos los candidatos que captamos: sería un
        desperdicio. Tú eliges al candidato que quieres. Entonces nuestro
        equipo jurídico hace una comprobación completa: categoría de visado en
        contrataciones internacionales, revisión de no competencia, contratos
        laborales vigentes que puedan restringirlos. Tarda días, no semanas, y
        ocurre en paralelo a tu proceso de oferta. De hecho acelera las cosas
        porque no te encuentras sorpresas después de que hayan aceptado.
    - question: ¿Podéis seleccionar para puestos ejecutivos y C-level?
      answer: >-
        Sí. Es donde más se diferencia nuestro enfoque de la selección
        transaccional. Para puestos de director, C-suite y consejo, hacemos
        headhunting. Conocemos candidatos, conocemos el mercado, sabemos quién
        es bueno y quién está disponible. Estos puestos no se cubren publicando
        una oferta: se cubren con relaciones y outreach estratégico.
    - question: ¿Cómo gestionáis las contrataciones internacionales y los visados?
      answer: >-
        Identificamos la categoría de visado correcta de antemano. Para
        nacionales de la UE en tu país de contratación, suele ser
        sencillo. Para contrataciones de fuera de la UE, valoramos la
        categoría de visado (HQP, D1, Skilled Worker, nómada digital o
        específica de la región), señalamos plazos y costes, y nos aseguramos
        de que tu oferta encaje con lo que el visado permite. Nuestro equipo
        jurídico gestiona el papeleo si la contratación necesita patrocinio de
        visado.
    - question: >-
        ¿Y si el candidato que quiero tiene un pacto de no competencia de su
        empleador anterior?
      answer: >-
        Lo revisamos de antemano. Algunos pactos de no competencia son
        exigibles; otros no (según geografía, sector, duración y jurisdicción).
        Si hay fricción, la señalamos antes de que hagas una oferta para que
        puedas decidir cómo navegarla: renegociar con el empleador anterior,
        esperar a que expire el pacto o pasar a otro candidato. Sin sorpresas.
    - question: ¿Podéis encontrar candidatos en campos de nicho o especializados?
      answer: >-
        Sí. Ahí es donde más importan nuestra profundidad de sourcing y
        nuestra red. Hemos colocado especialistas de nicho en varios sectores.
        Tarda más que publicar un puesto estándar, a veces semanas, pero
        encontramos a la persona. Somos honestos con los plazos en lugar de
        prometer una rapidez que no podemos entregar.
    - question: ¿Y la garantía de 1 sustitución gratuita? ¿Cuándo aplica?
      answer: >-
        Si el candidato se marcha o determinas que no encaja en los 60 días
        siguientes a la incorporación, captamos y presentamos un candidato de
        sustitución sin cargo. Ya has pagado el honorario del 10 % de la
        primera contratación; la sustitución es nuestra confianza en esa
        contratación. Si ocurre más de una vez, suele indicar o bien un
        desajuste sobre lo que el puesto necesita o algo en el entorno de tu
        empresa: lo hablaremos contigo.
    - question: ¿Trabajáis con candidatos pasivos o solo con quienes buscan empleo activamente?
      answer: >-
        Con ambos. Captamos candidatos activos del mercado, pero mucho buen
        talento no está buscando de forma activa. Hacemos headhunting de
        candidatos pasivos: personas a gusto en su puesto actual pero abiertas
        a la oportunidad adecuada. El sourcing pasivo suele tardar más, pero
        saca a relucir mejor talento.
    - question: ¿Cómo captáis candidatos? ¿Usáis una base de datos o una plataforma?
      answer: >-
        Combinamos nuestras herramientas propias de sourcing, outreach directo
        a la red y relaciones de headhunting construidas durante años en
        nuestros mercados. En perfiles de nicho, es sobre todo headhunting y
        contacto directo. En perfiles estándar, combinamos sourcing activo con
        recomendaciones de la red. No dependemos de un único enfoque.
    - question: ¿Cuál es la estructura de honorarios? ¿Cuándo pago?
      answer: >-
        El 10 % del salario bruto anual del candidato, pagado 15 días después
        de que empiece a trabajar. Un único pago. Si la contratación no
        funciona en los dos primeros meses, no pagas la sustitución: la
        buscamos sin coste porque ya invertiste en la primera contratación.
    - question: ¿Colocáis candidatos a escala internacional o solo en Europa?
      answer: >-
        En servicios de selección nos centramos en los cinco mercados europeos:
        España, Alemania, Portugal, Polonia e Italia. En búsquedas ejecutivas y
        C-level, podemos captar a escala global según el puesto. También
        tenemos operaciones especializadas de selección en la región del GCC y
        en EE. UU. bajo entidades separadas: pregunta si necesitas colocación
        fuera de Europa.
    - question: ¿Quién es Iberia Workforce y cómo operáis la selección?
      answer: >-
        Iberia Workforce forma parte de Connect Group. Operamos los servicios
        de selección a través de nuestros equipos internos de headhunters,
        sourcers y abogados laboralistas en Europa. No externalizamos el
        sourcing a socios locales: el mismo equipo que encuentra a tu
        candidato es el que valida su capacidad jurídica de incorporarse.
        Asumimos la responsabilidad de la calidad y el encaje de cada
        contratación.

closing:
  heading: >-
    Una buena selección es más que un nombre y un currículum. Es encontrar a
    alguien que encaja.
  footnote: >-
    Validar que realmente pueda aceptar el puesto y respaldar ese compromiso
    con una garantía. No pagas hasta que empiezan. Si no funciona en 60 días,
    te encontramos a otra persona sin coste. Describe el puesto que estás
    cubriendo: seniority, especialización, ubicación, plazo, y te diremos
    exactamente cuánto tardará. Sin obligación.
