    Externalización de personal en Europa. Permanente, estacional y de
    proyecto bajo un solo acuerdo. Tú diriges el trabajo; nosotros, RR. HH.
    y compliance.
  schema:
    serviceName: Servicios de externalización de personal
    serviceType: Externalización de personal y gestión de plantilla
    areaServed: Europa
    address:
      locality: Barcelona
      country: España

hero:
  heading: Servicios de externalización de personal
  subheading: Opera sin gestionar los RR. HH. y el compliance de tu plantilla
  badges:
    - icon: law
      label: Respaldados por un despacho de abogados
    - icon: talk
      label: Complejidad de la extinción resuelta
    - icon: licence
      label: Permanente + estacional + ad hoc
  body: >-
    Tienes plantilla permanente, picos estacionales y necesidades de proyecto
