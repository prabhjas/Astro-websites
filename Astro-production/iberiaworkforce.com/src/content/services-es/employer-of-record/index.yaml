# The Figma accordion is drawn closed, so it specifies the questions but no
# answers. Copy supplied by the client. Two answers point at the Spain country
# page, which does not exist yet — see the known gaps in CLAUDE.md.
faq:
  eyebrow: EMPLOYER OF RECORD EUROPA
  heading: Preguntas frecuentes
  items:
    - question: ¿Es legal el employer of record en Europa?
      answer: >-
        Sí. El EOR es una estructura laboral reconocida y muy utilizada en
        Europa. Los requisitos legales varían según el país: en España, por
        ejemplo, la ley exige una licencia ETT para ceder trabajadores a un
        tercero de forma legal. La mayoría de los proveedores no la tienen.
        Nosotros sí. Todos los detalles en nuestra página de EOR en España.
      link:
        label: EOR en España
        href: /employer-of-record/spain
    - question: ¿Cuánto cuesta un employer of record?
      answer: >-
        Nuestro servicio de EOR en España está tarifado a 299 € por empleado y
        mes: tarifa plana, sin costes de alta para contrataciones estándar de
        la UE. El precio en otros países depende de la plantilla y de la
        estructura laboral. Te damos un desglose completo antes de cualquier
        compromiso. Sin obligación.
    - question: ¿En cuánto tiempo puedo contratar a través de un EOR?
      answer: >-
        Para nacionales de la UE en una estructura laboral estándar, la mayoría
        de los clientes quedan dados de alta en unos pocos días hábiles desde
        que recibimos la documentación necesaria. Las contrataciones de fuera
        de la UE o los casos de permiso de trabajo tardan más: los plazos
        dependen de la categoría de visado y de la nacionalidad del empleado.
        Te damos una estimación realista de antemano, no una optimista.
    - question: ¿Cuál es la diferencia entre un EOR y un PEO?
      answer: >-
        Un PEO (Professional Employer Organisation) coemplea a los
        trabajadores junto con la empresa cliente, lo que exige que el cliente
        tenga una entidad registrada en el país. Un EOR contrata al trabajador
        de forma directa y es el único empleador legal. Esa distinción importa
        cuando no tienes entidad local y no quieres tenerla.
    - question: ¿Puede un EOR gestionar permisos de trabajo de fuera de la UE?
      answer: >-
        Sí. Contamos con abogados de extranjería internos que gestionan visados
        no Schengen, permisos de trabajo y documentación compleja para
        nacionales de fuera de la UE. Incluye nacionalidades que otros
        proveedores suelen rechazar de forma rutinaria.
    - question: ¿El EOR es compatible con la Ley Beckham?
      answer: >-
        Puede serlo, pero la interacción entre el EOR y el régimen fiscal de la
        Ley Beckham exige una estructuración cuidadosa. La respuesta completa
        está en nuestra página de EOR en España.
      link:
        label: EOR en España
        href: /employer-of-record/spain

