hero:
  heading: Servicios de Employer of Record para empresas que contratan en Europa
  badges:
    - icon: protect
      label: Licencia ETT
    - icon: law
      label: Respaldados por un despacho de abogados
    - icon: employee
      label: 30 años de derecho laboral español
    - icon: global
      label: 5 países europeos
  body: >-
    La mayoría de los proveedores de EOR en Europa son plataformas con socios
    locales. Nosotros somos una operación respaldada por un despacho de abogados
    con 30 años de práctica en derecho laboral español y asumimos los casos que
