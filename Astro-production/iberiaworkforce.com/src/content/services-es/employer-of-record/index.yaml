definition:
  heading: ¿Qué es un Employer of Record?
  body: >-
    Un employer of record es una empresa que contrata trabajadores en nombre de
    otra. El EOR gestiona el contrato de trabajo, la nómina, el alta fiscal y el
    cumplimiento normativo, mientras el cliente dirige el trabajo del día a día.
    Es la vía legal para contratar en un país en el que no tienes entidad
    registrada y no quieres constituir una.
  image: ../../../assets/images/eor-hub-eor-definition.webp
  imageAlt: Dos compañeros revisando un documento juntos en la terraza de una oficina

differentiator:
  heading: Contrata de forma legal en Europa sin constituir una entidad local
  paragraphs:
    - >-
      La mayoría de las plataformas globales de EOR funcionan bastante bien,
      hasta que llegas a un país en el que la capa de compliance sí importa. El
      derecho laboral europeo no es uniforme. Convenios colectivos,
      indemnizaciones legales, estructuras de Seguridad Social, categorías de
      permiso de trabajo: varían de un país a otro, y la diferencia entre
      hacerlo bien y hacerlo mal no es pequeña.
    - >-
      Nuestro EOR lo dirigen abogados internos y especialistas en extranjería.
      No gestores de cuentas que trabajan con una lista de comprobación. Si ya
      estás con un proveedor global de EOR y algo se ha torcido —un problema de
      visado, un conflicto contractual, un fallo de compliance que nadie detectó
      a tiempo—, recibimos esas llamadas con regularidad. Sabemos qué falló y
      cómo resolverlo.
  background: ../../../assets/images/eor-hub-local-entity.webp

howItWorks:
  heading: ¿Cómo funciona el Employer of Record?
  steps:
    - title: Cuéntanos a quién necesitas contratar
      description: >-
        Comparte el puesto, la ubicación y la fecha de incorporación.
        Identificamos la estructura laboral adecuada y señalamos las
        consideraciones de compliance antes de firmar nada.
      image: ../../../assets/images/step-01-brief.webp
      imageAlt: Dos compañeros en un despacho de Madrid revisando un documento juntos
    - title: Nosotros nos encargamos de lo jurídico y del compliance
      description: >-
        Contrato de trabajo, alta en nómina, inscripción en la Seguridad Social,
        tramitación del permiso de trabajo. Lo gestionan nuestros abogados, no
        un socio local de terceros.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: Una persona firmando un contrato de trabajo impreso en un escritorio
    - title: Tu empleado empieza a trabajar. Con plena conformidad.
      description: >-
        Gestionamos la nómina, la administración de RR. HH. y seguimos siendo el
        employer of record. Tú diriges el trabajo. Nosotros asumimos el riesgo
        jurídico.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: Un nuevo empleado siendo recibido en un espacio de trabajo abierto
  prompt: ¿Listo para contratar en Europa sin asumir el riesgo jurídico?
  cta:
    label: Habla con un especialista
    href: "#contact-form"

included:
  eyebrow: SOPORTE INTEGRAL
  heading: ¿Qué incluye un servicio de Employer of Record?
  items:
    - icon: employment-contracts
      title: Contratos de trabajo
      description: >-
        Redactados conforme al derecho laboral local de cada país. Alineados con
        los convenios colectivos cuando correspondan.
    - icon: payroll
      title: Gestión de nóminas
      description: >-
        Gestión completa de la nómina, incluidas retenciones fiscales,
        deducciones legales y recibos de salario en el formato local.
    - icon: social-security
      title: Alta en la Seguridad Social
      description: >-
        Inscripción del empleado en la autoridad nacional de Seguridad Social
        correspondiente, desde el primer día.
    - icon: work-permits
      title: Permisos de trabajo y apoyo en visados
      description: >-
        Nacionales de fuera de la UE y categorías de visado no Schengen
        gestionados por abogados de extranjería internos, no externalizados a
        un tercero.
    - icon: cba-compliance
      title: Cumplimiento de convenios colectivos
      description: >-
        Identificamos el convenio colectivo aplicable a cada puesto y lo
        integramos en la estructura laboral desde el inicio.
    - icon: expenses
      title: Gestión de gastos
      description: >-
        Gastos del empleado tramitados y reembolsados conforme a las normas
        fiscales locales y a la política de la empresa.
    - icon: severance
      title: Indemnización y baja
      description: >-
        Extinciones gestionadas con pleno cumplimiento de la ley local: plazos
        de preaviso, indemnización legal y liquidaciones finales calculadas
        correctamente.
    - icon: hr-admin
      title: Administración continua de RR. HH.
      description: >-
        Modificaciones de contrato, revisiones salariales, gestión de
        ausencias y documentación de RR. HH. a lo largo de toda la relación
        laboral.

