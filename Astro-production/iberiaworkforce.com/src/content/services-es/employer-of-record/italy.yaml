  cta:
    label: Habla con un especialista
    href: "#contact-form"

# Figma draws the accordion closed and specifies only the questions; the answers
# below were supplied by the client. The eyebrow is corrected here: all three
# frames still read "EMPLOYER OF RECORD POLAND", a leftover from the frame they
# were duplicated from.
faq:
  eyebrow: EMPLOYER OF RECORD ITALIA
  heading: Preguntas frecuentes
  items:
    - question: ¿Es legal el employer of record en Italia?
      answer: >-
        Sí. El EOR es una estructura laboral reconocida y legal en el derecho
        italiano. No se exige una licencia especial para operar como proveedor
        de EOR en Italia: la responsabilidad recae en hacer el trabajo
        correctamente, no en ostentar una credencial.
    - question: ¿Qué es un CCNL y por qué importa para mi contratación?
      answer: >-
        CCNL significa Contratti Collettivi Nazionali di Lavoro: convenios
        colectivos sectoriales. Italia no tiene un único salario mínimo
        nacional. En su lugar, cada sector tiene acuerdos negociados que fijan
        salarios mínimos, clasificaciones de puesto, beneficios y derechos de
        ausencia. El puesto de tu empleado debe clasificarse en el CCNL
        correcto, o el contrato se rechaza y las solicitudes de visado se
        atascan. Asignamos tu puesto al CCNL adecuado desde el primer día.
    - question: ¿Por qué fallan las plantillas globales de EOR en Italia?
      answer: >-
        Las plantillas globales se escribieron para países con normas
        salariales más simples. No contemplan los mínimos específicos del CCNL,
        no presupuestan correctamente el TFR (devengo de indemnización) ni las
        cotizaciones al INPS, y a menudo se saltan los procedimientos italianos
        de extinción. El contrato o bien lo rechazan las autoridades italianas
        o la nómina te sorprende.
    - question: ¿En cuánto tiempo puedo contratar a alguien en Italia?
      answer: >-
        Para nacionales de la UE/EEE con documentación estándar: normalmente
        1–2 semanas. Las contrataciones de fuera de la UE que necesitan visado
        tardan más: depende de su nacionalidad y de la categoría de visado.
        Italia tiene ventanas concretas de solicitud de visado que se abren en
        fechas fijas cada año, así que el calendario importa. Te daremos un
        plazo realista de antemano según tu situación.
    - question: ¿Cómo es el proceso de visado para contrataciones de fuera de la UE?
      answer: >-
        El sistema de visados italiano funciona con un calendario de
        solicitudes: las ventanas se abren en momentos concretos (normalmente
        enero–febrero de cada año), presentas la solicitud en esa ventana y el
        cupo se agota por orden de llegada. Gestionamos el papeleo y los plazos
        para que tu solicitud entre cuando la ventana está abierta. Si se pierde
        una ventana, esperas a la siguiente: por eso importan la preparación y
        el calendario.
    - question: ¿Qué es el TFR y por qué suma a mis costes?
      answer: >-
        El TFR (Trattamento di Fine Rapporto) es la indemnización que la ley
        italiana exige a los empleadores devengar a lo largo de la relación
        laboral: aproximadamente un 7,4 % del salario al año. Se paga al
        empleado al finalizar el empleo, bien como liquidación final o bien
        incorporado a un fondo de pensiones. No se paga todo de entrada: lo
        devengamos mensualmente como parte de tus costes totales de empleo.
        Cuando el empleado se marcha, el TFR se calcula y se paga conforme a la
        ley italiana.
    - question: ¿Por qué el coste de la nómina es más alto en Italia que en otros países?
      answer: >-
        La ley italiana exige a los empleadores pagar cotizaciones al INPS
        (Seguridad Social, aproximadamente un 30 % de coste empresarial),
        devengo del TFR (aproximadamente un 7,4 %), pagas extraordinarias
        (pagas del 13.er y 14.º mes impuestas por el CCNL), más el propio
        salario base. No son opcionales: los exige la ley y el CCNL del sector.
        Así que el coste total de emplear a alguien en Italia es realmente más
        alto que en países sin estos requisitos.
    - question: ¿Quién es Iberia Workforce y cómo operáis en Italia?
      answer: >-
        Iberia Workforce forma parte de Connect Group. Operamos en Italia desde
        Milán con nuestro propio equipo jurídico y de nóminas, sin intermediario
        local. Estamos aquí, gestionamos tus contratos y solicitudes de visado
        de forma directa y asumimos la responsabilidad jurídica del compliance.
        Los servicios de empleo los prestan abogados y especialistas de nómina
        que trabajan cada día con el derecho laboral italiano y entienden la
        asignación al CCNL, la contabilidad del TFR y el cumplimiento del INPS.
    - question: ¿Podemos contratar a alguien en remoto en Italia si está basado en otro sitio?
      answer: >-
        Si está en Italia más de 183 días al año, se convierte en residente
        fiscal y se aplica la ley italiana a toda la relación laboral. Si
        trabaja fuera de Italia, se aplica el derecho laboral de ese país. Y si
        es una contratación de fuera de la UE, su categoría de visado también
        puede restringir dónde puede trabajar. Cuéntanos el planteamiento:
        país de origen, dónde trabajará realmente, situación de visado si
        aplica, y confirmaremos qué rige antes de que contrates.
    - question: ¿Qué ocurre si necesito poner fin a la relación laboral de alguien?
      answer: >-
        La ley italiana no permite el despido a voluntad. El despido exige o
        bien una conducta documentada o bien la acreditación de una necesidad
        económica (como una reestructuración). Gestionamos el proceso para que
        la extinción se tramité correctamente, se documente como es debido, la
        indemnización final y el TFR se calculen bien y no te exponga a
        conflictos jurídicos después.

closing:
  heading: >-
    El derecho laboral italiano no es más difícil porque esté mal escrito. Es
    detallado porque las protecciones del empleado están integradas en la base
  subheading: A través de las normas del CCNL, los requisitos del INPS y las salvaguardas del TFR
  body: >-
    Cuéntanos a quién quieres contratar, quién es esa persona y dónde está
    basada. Asignaremos el CCNL correcto y la vía de visado si hace falta,
    construiremos el contrato como corresponde y te diremos exactamente cuáles
    son los costes, antes de que te comprometas a nada.
