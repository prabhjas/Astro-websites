    jubilación, permisos legales. A un precio inferior al de contratar tu
    propio equipo jurídico y de nóminas.
  image: ../../../assets/images/eor-poland-hero-background-desktop.webp
  imageTablet: ../../../assets/images/eor-poland-hero-background-tablet.webp
  imageMobile: ../../../assets/images/eor-poland-hero-background-mobile.webp
  imageAlt: ""
  primaryCta:
    label: Habla con un especialista
    href: "#contact-form"
  secondaryCta:
    label: ¿Cómo funciona?
