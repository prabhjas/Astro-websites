featureList:
  layout: aside
  # The heading and its button travel with the list, as the homepage does it.
  sticky: true
  heading: ¿Qué incluyen los servicios de Employer of Record en Polonia?
  items:
    - eyebrow: Incluido
      title: Contratos de trabajo y cumplimiento legal
      description: >-
        Redactados en polaco, estructurados conforme al derecho laboral polaco
        con todas las cláusulas exigidas: descripción del puesto, retribución,
        jornada, periodo de prueba (máximo 3 meses), plazos de preaviso según
        antigüedad, protección de datos. Versiones bilingües disponibles.
    - eyebrow: Incluido
      title: Nómina, Seguridad Social e impuesto sobre la renta
      description: >-
        Nómina mensual con cotizaciones empresariales a la Seguridad Social
        (pensión, incapacidad, enfermedad, accidente, salud), retención de las
        deducciones del empleado, retención del impuesto sobre la renta y
        aportaciones a fondos empresariales. Presentada antes del día 15 del
        mes siguiente.
    - eyebrow: Incluido
      title: Gestión del ahorro obligatorio para la jubilación (PPK)
      description: >-
        Alta con la entidad financiera, aportación mínima empresarial del 1,5 %,
        deducción del 2 % del empleado, seguimiento de bajas voluntarias y el
        ciclo de reinscripción de marzo de 2027, gestionados de extremo a
        extremo.
    - eyebrow: Incluido
      title: Vacaciones anuales y baja por enfermedad
      description: >-
        20 o 26 días laborables al año según antigüedad. Baja por enfermedad al
        80 % del salario los primeros 33 días de cada año natural; después
        asume el seguro estatal. Todo calculado y documentado correctamente.
    - eyebrow: Incluido
      title: Apoyo en extinción e indemnización
      description: >-
        Plazos de preaviso según antigüedad (de 2 semanas a 3 meses), causas
        justificadas, cálculo de indemnización, documentación adecuada para que
        un despido resista si se impugna.
  cta:
    label: Habla con un especialista
    href: "#contact-form"

