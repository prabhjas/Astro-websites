intro:
  heading: ¿Qué es un Employer of Record en Polonia?
  paragraphs:
    - >-
      Un employer of record en Polonia es una estructura jurídica que se
      convierte en el empleador formal de tus trabajadores bajo un contrato de
      trabajo polaco. Tú diriges el trabajo, defines el puesto y gestionas el
      rendimiento. Nosotros nos encargamos del contrato en polaco, del alta en
      ZUS (el sistema de seguro social de Polonia), de la inscripción en el
      ahorro obligatorio para la jubilación, de la nómina mensual con IRPF y
      cotizaciones sociales, y asumimos el riesgo jurídico del compliance.
  quote:
    statements:
      - Sin necesidad de constituir una sociedad polaca.
      - Sin semanas perdidas con las autoridades fiscales.

differentiator:
  # Cream with no photograph — the only frame so far to argue this point without
  # a navy band behind it. Hence `tone`, and hence no `background` key.
  tone: light
  heading: ¿Por qué el Employer of Record funciona de otra manera en Polonia?
  subheading: La ley es clara. La ejecución es detallada.
  paragraphs:
    - >-
      El derecho laboral polaco se lee más sencillo que en la mayoría de los
      sitios: sin política de comité de empresa, sin complicaciones de la Ley
      Beckham. Esa sencillez lleva a los empleadores extranjeros a pensar que
      no necesitan abogados. Entonces llega el segundo mes: una sanción por
      incumplimiento del ahorro para la jubilación, un disparador de residencia
      fiscal que nadie señaló, o una inspección por mala clasificación de
      autónomos.
    - >-
      La mayoría de las plataformas globales de EOR tratan Polonia como una
      lista de comprobación: número de alta, nómina en marcha, listo. Nosotros
      lo tratamos como lo que es: una contratación rentable si se ejecuta bien,
      y catastrófica si no. Por eso hace falta especialistas de nómina
      internos, no plantillas.
  cta:
    label: Habla con un especialista
    href: "#contact-form"

whyChoose:
  layout: cards
  heading: >-
    ¿Por qué elegir Iberia Workforce para servicios de Employer of Record en
    Polonia?
  items:
    - title: >-
        Lo dirigen abogados laboralistas y especialistas en extranjería, no
        gestores de cuentas.
      description: >-
        La mayoría de las plataformas de EOR externalizan el compliance a
        socios locales. Nosotros lo gestionamos de forma directa: derecho
        laboral, visados, nómina. En contrataciones de la UE, eso significa
        rapidez. En las de fuera de la UE, significa que tu visado no se
        atasca.
    # The desktop frame breaks this into three short lines; both narrow frames
    # run them together, which is what is followed here.
    - title: Tu coste es inferior al de contratar tu propio equipo.
      description: >-
        Abogado laboralista, especialista en extranjería, experto en nóminas,
        contable de compliance: eso son 700–1.500 €/mes de estructura. Nuestro
        precio de EOR es menor. El PPK se gestiona internamente, nunca se
        externaliza. Alta automática, seguimiento de bajas voluntarias, gestión
        mensual: sin proveedor aparte, sin facturas de sanciones.

howItWorks:
  heading: ¿Cómo funciona el Employer of Record en Polonia?
  steps:
    - title: Cuéntanos la contratación
      description: >-
        Puesto, ubicación, fecha de incorporación, salario, UE o fuera de la
        UE. Si es de fuera de la UE, ¿qué categoría de visado? Valoramos la
        estructura adecuada y señalamos cualquier complejidad de antemano.
      image: ../../../assets/images/step-01-brief.webp
      imageAlt: Dos compañeros en un escritorio de oficina revisando un documento juntos
    - title: Redactamos y tramitamos el alta
      description: >-
        Contrato de trabajo en polaco con todas las cláusulas exigidas por ley.
        Alta en el seguro social, configuración fiscal, parametrización de la
        nómina, inscripción en el ahorro para la jubilación y seguimiento de
        bajas voluntarias. Tú apruebas. Nosotros tramitamos.
      image: ../../../assets/images/step-02-contract.webp
      imageAlt: Una persona firmando un contrato de trabajo impreso en un escritorio
    - title: "Tu empleado empieza: la nómina se ejecuta correctamente"
      description: >-
        Nómina mensual: cálculo bruto-neto, retención del impuesto sobre la
        renta, cotizaciones a la Seguridad Social, deducciones del ahorro para
        la jubilación, control de ausencias, devengo de baja por enfermedad.
        Presentamos los informes de nómina mensuales antes del día 15. La
        extinción y la indemnización se estructuran para que resistan.
      image: ../../../assets/images/step-03-onboarding.webp
      imageAlt: Un nuevo empleado siendo recibido en un espacio de trabajo abierto
  prompt: ¿Listo para contratar en Polonia sin asumir el riesgo jurídico?
  cta:
    label: Habla con un especialista
    href: "#contact-form"

