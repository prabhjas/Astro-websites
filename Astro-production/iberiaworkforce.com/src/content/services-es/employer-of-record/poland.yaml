  cta:
    label: Habla con un especialista
    href: "#contact-form"

# Figma draws the accordion closed and specifies only the questions; the answers
# below were supplied by the client.
faq:
  eyebrow: EMPLOYER OF RECORD POLONIA
  heading: Preguntas frecuentes
  items:
    - question: ¿Es legal el employer of record en Polonia?
      answer: >-
        Sí. El EOR es una estructura laboral reconocida en el derecho polaco.
        No se exige una licencia especial para operar como proveedor de EOR en
        Polonia: la responsabilidad de compliance recae en la ejecución del
        EOR, no en una credencial regulatoria.
    - question: ¿Qué es exactamente el PPK (ahorro obligatorio para la jubilación) y por qué importa?
      answer: >-
        El PPK es un programa obligatorio de ahorro para la jubilación. Los
        empleadores deben inscribir a los empleados elegibles; aportas un
        mínimo del 1,5 % del salario y los empleados aportan el 2 %. El
        incumplimiento conlleva sanciones de hasta 1.000.000 PLN. Queda fuera
        de la nómina estándar, así que es donde se rompe el compliance en
        proveedores sin equipos de nómina dedicados que lo gestionen mes a mes.
    - question: ¿Cuánto cuesta realmente la Seguridad Social?
      answer: >-
        Las cotizaciones empresariales a la Seguridad Social suman
        aproximadamente un 19–21 % del salario bruto, además de la retribución
        base. El tipo exacto depende del puesto. Lo calculamos con precisión
        por cada contratación: no hay “aproximación” con la Seguridad Social
        polaca.
    - question: ¿Qué ocurre si mi empleado permanece más de 183 días en Polonia?
      answer: >-
        Si permanece más de 183 días en un año natural, se convierte en
        residente fiscal polaco y debe declarar en Polonia sus rentas mundiales.
        Señalamos este umbral de antemano.
    - question: ¿Podemos contratar a alguien en remoto y que trabaje fuera de Polonia?
      answer: >-
        Si el trabajo se presta de forma habitual fuera de Polonia, se aplica
        el derecho laboral de ese país, no el polaco. Si está en Polonia 183
        días o más, es residente fiscal polaco en cualquier caso. Cuéntanos el
        escenario y aclararemos las implicaciones fiscales y laborales antes
        de contratar.
    - question: ¿Cuál es la diferencia entre un contrato temporal y uno indefinido?
      answer: >-
        El derecho polaco permite contratos temporales de hasta 3 años en
        total (incluidas las renovaciones). Los contratos indefinidos no tienen
        fecha de fin. Los plazos de preaviso dependen de la antigüedad, no del
        tipo de contrato. Estructuramos el tipo adecuado según tu necesidad de
        contratación.
    - question: ¿Quién es Iberia Workforce y cuál es vuestra estructura jurídica en Polonia?
      answer: >-
        Iberia Workforce opera como employer of record en Polonia a través de
        nuestra propia entidad registrada en Varsovia, sin intermediario local.
        Formamos parte de Connect Group. Nuestro equipo interno jurídico y de
        nóminas gestiona tu contrato, las presentaciones a la Seguridad Social
        y los visados de forma directa.

closing:
  heading: La ventaja de contratar en Polonia es la eficiencia. Hay que acertar.
  # The desktop and tablet frames draw this two-paragraph lead; the mobile frame
  # substitutes a one-liner. The full copy is followed here — the component sets
  # it at the same scale at every width, so nothing is gained by truncating it.
  body: >-
    El cumplimiento de la Seguridad Social, la inscripción en el ahorro para la
    jubilación, los disparadores de residencia fiscal, la clasificación de
    autónomos: no ocurren por casualidad. Exigen abogados y especialistas de
    nómina que sepan lo que hacen. Cuéntanos a quién necesitas contratar. Te
    explicaremos la estructura adecuada, el coste mensual real y cada plazo
    entre ahora y el primer día.
