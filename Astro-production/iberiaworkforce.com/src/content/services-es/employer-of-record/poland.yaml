  title: Employer of Record en Polonia | Iberia Workforce
  description: >-
    Employer of Record en Polonia. Kodeks pracy, ZUS y PPK gestionados
    correctamente. Menor coste que montar tu propio equipo jurídico: todo
    incluido.
  schema:
    serviceName: Servicios de Employer of Record Polonia
    serviceType: Employer of Record
    areaServed: Polonia
    address:
      locality: Varsovia
      country: Polonia

hero:
  tone: light
  heading: Employer of Record en Polonia
  subheading: Contrata empleados sin abrir una sociedad
  badges:
    - icon: law
      label: Respaldados por un despacho de abogados
    - icon: licence
      label: Expertos en el Kodeks Pracy
    - icon: money
      label: Equipo interno de nóminas en Polonia
  body: >-
    Contrata empleados en Polonia sin abrir una sociedad. Todo el compliance
