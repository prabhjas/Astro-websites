    # true — see the note in CLAUDE.md's known gaps.
    cta:
      label: Ver todos los detalles de EOR
      href: /employer-of-record
  custom:
    eyebrow: Permisos de trabajo de fuera de la UE
    heading: Presupuesto a medida
    tagline: Sin costes ocultos.
    description: >-
      Los visados HQP, los visados de nómada digital y los permisos de trabajo
      ordinarios varían según la nacionalidad y la categoría de visado.
      Presupuestamos después de valorar tu caso concreto.
    cta:
      label: Habla con un experto
      href: "#contact-form"
  footnote:
    heading: ¿Por qué importa un precio transparente?
    body: >-
      Los costes de nómina en España están fijados por ley (tipos de TGSS,
      retención de IRPF). La única variable es la complejidad del visado. Te
      decimos de antemano por qué estás pagando.

# The Figma accordion is drawn closed: it specifies the seven questions and no
# answers. Both the questions and the answers below are the client's copy, which
# expands several of the questions past the label Figma draws — the design gives
# the order, the client gives the words.
faq:
  eyebrow: EMPLOYER OF RECORD ESPAÑA
  heading: Preguntas frecuentes
  items:
    - question: ¿Es legal el employer of record en España?
      answer: >-
        Sí. El EOR es una estructura laboral reconocida en el derecho español.
        El proveedor de EOR debe tener licencia ETT para operar de forma legal.
        Nosotros la tenemos.
    - question: ¿Cómo encaja el EOR con la Ley Beckham en España?
      answer: >-
        La Ley Beckham (el régimen de tipo fijo del 24 % durante 5 años para
        nuevos residentes) y el EOR pueden combinarse, pero exigen una
        estructuración cuidadosa. El contrato de trabajo y la residencia fiscal
        deben alinearse para proteger la elegibilidad Beckham. Lo garantizamos
        desde el primer día.
    - question: ¿Podéis gestionar visados HQP y de nómada digital?
      answer: >-
        Sí. Los visados HQP (Highly Qualified Professional) y los visados de
        nómada digital son cada vez más habituales. Gestionamos la solicitud de
        visado, el cumplimiento de la nómina y nos aseguramos de que se cumplan
        los requisitos documentales a lo largo de toda la vigencia del visado.
    - question: ¿En cuánto tiempo puedo contratar a alguien en España?
      answer: >-
        Nacionales de la UE con documentación estándar: 5–10 días hábiles.
        Nacionales de fuera de la UE con permiso de trabajo: más tiempo, según
        la categoría de visado y la rapidez de la Administración. Damos plazos
        realistas de antemano.
    - question: ¿Qué ocurre con la indemnización en España? ¿Mi contratación está en riesgo?
      answer: >-
        La ley española exige un despido justificado. Las reclamaciones por
        despido improcedente pueden ser costosas. Estructuramos la relación
        laboral desde la contratación hasta una posible salida para protegerte.
        Si la extinción se impugna, tenemos abogados para defenderla.
    - question: ¿Gestionáis el teletrabajo transfronterizo?
      answer: >-
        Si tu empleado está basado en España, se aplica la ley española. Si
        teletrabaja fuera de España, rigen normas distintas según su ubicación
        y su situación de visado. Cuéntanos el escenario y lo aclararemos antes
        de contratar.
    - question: ¿Quién es Iberia Workforce? ¿Cuál es vuestra estructura jurídica en España?
      answer: >-
        Iberia Workforce opera como employer of record con licencia ETT en
        España. Tenemos nuestra sede en Barcelona y formamos parte de Connect
        Group. Los servicios de empleo se prestan a través de una estructura
        jurídica interna respaldada por un despacho de abogados español con 30
        años de experiencia en derecho laboral.

closing:
  heading: >-
    La mayoría de los problemas de contratación en España no son complicados.
    Solo hace falta alguien que de verdad conozca el derecho laboral español.
  body: >-
    Cuéntanos qué quieres hacer —una contratación, un caso de visado, un
    despliegue en varios países— y te diremos exactamente cómo funciona. Sin
    jerga. Sin sorpresas.
