  eyebrow: PRECIOS
  heading: Precios transparentes. Sin costes ocultos.
  plan:
    name: EOR estándar
    price: "€299"
    unit: / empleado / mes
    note: Tarifa plana. Sin costes de alta para contrataciones estándar de la UE. Sin sorpresas.
    features:
      - Sin costes de alta para nacionales de la UE
      - Contrato de trabajo y TGSS
      - Gestión de nóminas
      - Cumplimiento de convenio
      - Administración de RR. HH.
    # Figma reuses the homepage card here, label and all. "See Full EOR Details"
