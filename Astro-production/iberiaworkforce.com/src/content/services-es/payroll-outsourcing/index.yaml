      badge: PRÓXIMAMENTE
      description: >-
        Nómina de la Deutsche Rentenversicherung, cumplimiento de la AÜG,
        continuación del salario en baja, coordinación con el comité de
        empresa, seguimiento de igualdad salarial al noveno mes.
    - name: Portugal
      badge: PRÓXIMAMENTE
      description: >-
        Alta en la Segurança Social, estructura salarial de 14 pagas, control
        del plus de comida, seguro de accidentes, cumplimiento del Código do
        Trabalho.
    - name: Poland
      badge: PRÓXIMAMENTE
      description: >-
        Cotizaciones a ZUS, gestión del ahorro para la jubilación PPK,
        cumplimiento del Kodeks Pracy, retención del impuesto sobre la renta,
        devengo de permisos legales.
    - name: Italia
      badge: PRÓXIMAMENTE
      description: >-
        Cotizaciones al INPS, devengo del TFR, cumplimiento salarial del CCNL,
        pagas extraordinarias, gestión de extinción e indemnización.

# The design draws the accordion closed, so it specifies the questions only.
# Answers supplied separately by the client, as on the EOR hub. Two questions
# are worded more fully here than in Figma ("Is it cheaper than hiring in-house?"
# against "…than hiring a payroll accountant in-house?", and the payroll-person
# one) — the client's wording is the one that ships.
faq:
  eyebrow: EXTERNALIZACIÓN DE NÓMINAS EUROPA
  heading: Preguntas frecuentes
  items:
    - question: ¿Cuánto cuesta la externalización de nóminas?
      answer: >-
        El precio depende de la plantilla y de los países en los que operas.
        Para empresas de menos de 50 empleados, cotizamos tarifas mensuales por
        empleado. Para empresas con 50 o más empleados en varios países,
        ofrecemos una retainer mensual. Cuéntanos tu escenario y te daremos un
        desglose exacto, sin obligación.
    - question: ¿Es más barato que contratar un contable de nómina interno?
      answer: >-
        Sí. Un especialista o contable de nómina interno cuesta 1.500–2.500 €
        al mes solo en salario, más reclutamiento, formación, beneficios y
        riesgo de rotación. Los servicios de externalización de nóminas
        empiezan por debajo y escalan con tu plantilla.
    - question: ¿Y si ya tengo una persona de nómina? ¿Podéis trabajar con ella?
      answer: >-
        Sí. Algunas empresas mantienen la nómina internamente pero necesitan
        apoyo en varios países. Otras externalizan por primera vez. Trabajamos
        con la estructura que tenga sentido para tu negocio.
    - question: ¿En cuánto tiempo podemos pasar a vuestros servicios de externalización de nóminas?
      answer: >-
        Para empresas que procesan la nómina internamente, normalmente 2–3
        semanas de transición si la documentación está lista. Si cambias de
        otro proveedor, el plazo depende de la complejidad de la migración de
        datos. Te daremos una estimación realista de antemano.
    - question: ¿Qué ocurre si mi empresa opera en varios países?
      answer: >-
        Gestionamos la nómina en España, Alemania, Portugal, Polonia e Italia.
        La de cada ubicación se ejecuta conforme al derecho laboral de su país,
        sin aproximaciones. Si tienes empleados en países en los que aún no
        operamos, podemos coordinarnos con socios locales en esas geografías.
    - question: >-
        ¿Podéis gestionar la documentación de visados y permisos de trabajo
        como parte de la externalización de nóminas?
      answer: >-
        Sí. Contrataciones de fuera de la UE, patrocinio de visados,
        tramitación de permisos de trabajo: si afecta a la nómina (residencia
        fiscal, categorización salarial, elegibilidad de beneficios), lo
        gestionamos como parte del servicio. Forma parte del trabajo de nuestro
        equipo jurídico, no se externaliza a un tercero.
    - question: ¿Qué ocurre si necesitamos cambiar el salario o las condiciones contractuales de un empleado?
      answer: >-
        Nos lo comunicas. Lo revisamos para el cumplimiento del derecho laboral
        —sueldos mínimos, impacto de la categoría de visado, implicaciones
        fiscales— y o bien lo aprobamos o bien proponemos una alternativa
        conforme que logre el mismo objetivo de negocio.
    - question: ¿Quién es Iberia Workforce y cómo operáis?
      answer: >-
        Iberia Workforce forma parte de Connect Group. Operamos la
        externalización de nóminas a través de un equipo interno de abogados
        laboralistas y especialistas de nómina en Europa. Sin procesamiento
        offshore. Sin socios locales de terceros. El equipo que estructura tu
        nómina es el mismo que se asegura de que sea jurídicamente sólida.

closing:
  heading: >-
    Contratas a personas para que hagan su trabajo. No deberías tener que
    convertirte en un experto en nóminas solo para evitar una sanción.
  highlight: experto en nóminas
  body: >-
    Describe tu equipo —tamaño, ubicaciones, cualquier complejidad de permiso
    de trabajo— y te diremos exactamente cuánto cuesta la externalización de
    nóminas y qué incluye.
