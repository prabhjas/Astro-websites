# The Figma accordion is drawn closed, so it specifies the questions but no
# answers. Copy supplied by the client alongside the design.
faq:
  eyebrow: TRABAJO TEMPORAL EUROPA
  heading: Preguntas frecuentes
  items:
    - question: ¿Es legal el trabajo temporal en los países en los que operáis?
      answer: >-
        Sí. El trabajo temporal es un modelo de empleo reconocido y
        legalmente establecido en Europa. Los proveedores deben tener la
        licencia o las credenciales pertinentes en cada país, y nosotros las
        tenemos. Operar sin la licencia adecuada es ilegal y expone a los
        clientes a sanciones y responsabilidad.
    - question: ¿Cuál es la diferencia entre trabajo temporal y temp-to-hire?
      answer: >-
        El trabajo temporal es de duración determinada o por proyecto: el
        puesto del trabajador termina en una fecha concreta. El temp-to-hire
        convierte una asignación temporal en un puesto permanente tras un
        periodo de prueba. Los requisitos legales difieren: el trabajo temporal
        tiene una fecha de fin definida en el contrato; el temp-to-hire incluye
        una vía de conversión. Gestionamos ambos.
    - question: ¿En cuánto tiempo podemos tener a un trabajador temporal en el puesto?
      answer: >-
        En perfiles estándar, normalmente 1–2 semanas desde la solicitud hasta
        el inicio, según lo detalladas que estén las especificaciones del
        puesto. Los perfiles especializados o de alta cualificación pueden
        tardar más si la captación es más competitiva. Te damos un plazo
        realista de antemano según la complejidad del puesto y la
        disponibilidad actual de candidatos.
    - question: ¿Qué ocurre si necesitamos terminar la asignación antes de tiempo?
      answer: >-
        Las asignaciones temporales terminan en la fecha de fin contratada. Si
        necesitas extinguir antes, la ley local exige causas documentadas, igual
        que en el empleo permanente. Gestionamos la salida correctamente para
        que no quede responsabilidad residual. La extinción anticipada es
        posible, pero sigue el procedimiento legal.
    - question: ¿Podemos usar trabajo temporal para trabajadores con visado patrocinado?
      answer: >-
        Sí. Los trabajadores de fuera de la UE con permiso de trabajo o visado
        pueden adscribirse a asignaciones temporales. La categoría de visado y
        las condiciones del permiso determinan qué puestos están permitidos
        legalmente. Lo verificamos de antemano y nos aseguramos de que la
        asignación coincida con la clasificación de visado del trabajador para
        que no haya incumplimiento.
    - question: ¿En qué se diferencia el trabajo temporal de usar autónomos?
      answer: >-
        El trabajo temporal significa que el trabajador está contratado por
        nosotros, no es autónomo. Eso importa jurídicamente: se aplican las
        protecciones del derecho laboral, las cotizaciones a la Seguridad
        Social las paga el empleador y el riesgo jurídico recae en el
        proveedor. Con autónomos, el trabajador es autónomo, lo que cambia por
        completo los requisitos de compliance.
    - question: ¿Qué ocurre si hay un incidente o un accidente durante la asignación?
      answer: >-
        Los accidentes laborales, incidentes o conflictos durante una
        asignación temporal siguen el mismo derecho laboral que los puestos
        permanentes. Asumimos la responsabilidad jurídica y gestionamos la
        investigación, la notificación del incidente y cualquier reclamación
        que surja. Tu empresa queda protegida de la exposición laboral directa.
    - question: ¿Quién es Iberia Workforce y cómo operáis?
      answer: >-
        Iberia Workforce forma parte de Connect Group. Operamos los servicios
        de trabajo temporal a través de nuestras propias estructuras con
        licencia en cada país, sin intermediarios locales. Nuestros equipos
        internos jurídicos y de RR. HH. gestionan la selección, el screening,
        la redacción de contratos, la nómina y el compliance de forma directa.
        Nosotros asumimos el riesgo jurídico y de compliance; tú diriges el
        trabajo del día a día.
    - question: ¿Podemos usar el trabajo temporal para necesidades estacionales recurrentes?
      answer: >-
        Sí. Muchos de nuestros clientes usan trabajo temporal recurrente para
        picos estacionales. Podemos estructurar contratos temporales
        renovables que se reanudan cada temporada, con pleno cumplimiento y
        una carga administrativa mínima para ti.

closing:
  heading: El trabajo temporal no es un atajo para eludir el derecho laboral.
  body: >-
    Es una vía conforme y legal de incorporar flexibilidad a tu plantilla. Pero
    solo si el proveedor asume el riesgo jurídico y entiende la capa de
    compliance.
  footnote: >-
    Describe tu necesidad de personal —puesto, duración, fecha de inicio,
    plantilla— y te diremos exactamente cuánto cuesta, en cuánto tiempo
    podemos cubrirla y qué cumplimiento estás obteniendo.
