name: Security dependency audit

on:
  push:
    branches: [main, work/astro-sites]
  pull_request:
    branches: [main, work/astro-sites, dev]
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production audit (fail on high+)
        run: pnpm audit --prod --audit-level=high
      - name: Full-graph audit (report only)
        run: pnpm audit --audit-level=high || true
